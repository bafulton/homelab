apiVersion: apps/v1
kind: Deployment
metadata:
  name: yak-shave
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: yak-shave
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yak-shave
    spec:
      # Deliberately unpinned: nothing here is stateful or LAN-bound, so it can
      # run on any node - ocifree included, once that joins.
      # See charts/README.md "Placement".
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: yak-shave
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # Without this the emptyDirs below mount root-owned and 0755, and a
        # non-root Caddy cannot create /config/caddy or /data/caddy.
        fsGroup: 1000
      containers:
        - name: caddy
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # The root filesystem is read-only, so everything Caddy writes gets
          # an emptyDir. It serves files and terminates no TLS, so none of it
          # needs to survive a restart.
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          emptyDir: {}
        - name: data
          emptyDir: {}
