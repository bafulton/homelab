apiVersion: apps/v1
kind: Deployment
metadata:
  name: yak-shave
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: yak-shave
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yak-shave
    spec:
      # Caddy never talks to the Kubernetes API, so the default service
      # account token it would otherwise mount is only a foothold.
      automountServiceAccountToken: false
      # Deliberately unpinned: nothing here is stateful or LAN-bound, so it can
      # run on any node - ocifree included, once that joins.
      # See charts/README.md "Placement".
      #
      # DoNotSchedule, not ScheduleAnyway. This was a soft podAntiAffinity and
      # both replicas still ran on rpi5: beelink's PreferNoSchedule taint is
      # scored by the TaintToleration plugin at a higher weight than either
      # soft-spreading plugin, so the preference to avoid beelink beat the
      # preference to spread. A hard constraint filters instead of scoring,
      # which the taint cannot outrank.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: yak-shave
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 1000
        runAsGroup: 1000
        # Without this the emptyDirs below mount root-owned and 0755, and a
        # non-root Caddy cannot create /config/caddy or /data/caddy.
        fsGroup: 1000
      containers:
        - name: caddy
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # /healthz rather than /, for two reasons: / is a redirect whose
          # target changes with every post, and kubelet polling it on every
          # pod would be almost all of the access log. The Caddyfile keeps
          # this path out of that log.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # The root filesystem is read-only, so everything Caddy writes gets
          # an emptyDir. It serves files and terminates no TLS, so none of it
          # needs to survive a restart.
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          emptyDir: {}
        - name: data
          emptyDir: {}
