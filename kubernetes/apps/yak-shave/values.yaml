# yak-shave.com - the blog.
#
# Source, design and posts live in sites/yak-shave/. CI builds the static site,
# bakes it into an image tagged with the commit, and writes that tag into
# `image.tag` below, so publishing a post is one push to main and nothing here
# is edited by hand.
#
# Access:
#   - Public: https://yak-shave.com (via Cloudflare Tunnel)
#   - www redirects to the apex
#
# No OpenTofu changes were needed: opentofu/cloudflare already gives
# yak-shave.com an apex and wildcard CNAME to the tunnel, routes both to
# Traefik, and Cloudflare Universal SSL covers the certificate.

namespace: yak-shave

image:
  repository: ghcr.io/bafulton/yak-shave
  # Written by .github/workflows/build-site.yaml on every push to main.
  # Immutable per commit, so there is no tag to overwrite and no VERSION to
  # remember to bump - the failure mode the images/ guard exists for cannot
  # happen here. Renovate deliberately does not track this.
  tag: "sha-563c4fd88336f6dfaf302520aea9afc085fd4a58"
  pullPolicy: IfNotPresent

# Two, one per node. The spread is enforced rather than preferred: beelink
# carries a PreferNoSchedule taint for the descheduler rebalance, and that
# preference outscores a soft podAntiAffinity, so both replicas were landing
# on rpi5 and a single node reboot would have taken the blog off the internet.
#
# The cost is that while a node is down or cordoned the second replica sits
# Pending rather than doubling up - which is the intended trade: one replica
# serving beats two replicas that share a failure domain.
replicaCount: 2

resources:
  requests:
    memory: 32Mi
    cpu: 10m
  limits:
    memory: 96Mi

gateway-route:
  routes:
    - name: apex
      hostnames:
        - yak-shave.com
      service:
        name: yak-shave
        port: 80
    # www exists because the wildcard CNAME answers for it; without a route of
    # its own Traefik would 404. Redirect rather than serve, so there is one
    # canonical host.
    - name: www
      hostnames:
        - www.yak-shave.com
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /
          filters:
            - type: RequestRedirect
              requestRedirect:
                scheme: https
                hostname: yak-shave.com
                statusCode: 301

signoz-alerts:
  alerts:
    - name: Yak Shave Down
      description: yak-shave.com has served nothing for five minutes
      severity: critical
      type: promql
      query: 'max by (namespace, deployment) (kube_deployment_status_replicas_available{namespace="yak-shave",deployment="yak-shave"})'
      op: "<"
      threshold: 1
      for: 5m0s

    # The hard topology spread means a node outage leaves the second replica
    # Pending indefinitely: the site still serves, quietly, with no redundancy
    # left and nothing else to say so. An hour clears a rollout, a pod restart
    # and a safe-reboot-node.sh drain, so this only fires when a node has been
    # down long enough to have been forgotten about.
    - name: Yak Shave Running Degraded
      description: yak-shave.com has been down to a single replica for an hour
      severity: warning
      type: promql
      query: 'max by (namespace, deployment) (kube_deployment_status_replicas_available{namespace="yak-shave",deployment="yak-shave"})'
      op: "<"
      threshold: 2
      for: 1h0m0s
