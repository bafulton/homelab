apiVersion: v1
kind: ServiceAccount
metadata:
  name: game-ports-controller
  namespace: {{ .Release.Namespace }}
---
# In the games namespace: read pool servers' Services, to route them.
# Gameplane's operator does the port allocation; this app only mirrors it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: game-ports-controller
  namespace: {{ .Values.gamesNamespace }}
rules:
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: game-ports-controller
  namespace: {{ .Values.gamesNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: game-ports-controller
subjects:
  - kind: ServiceAccount
    name: game-ports-controller
    namespace: {{ .Release.Namespace }}
---
# Here: the gateway's routes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: game-ports-controller
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [game-ports-routes]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: game-ports-controller
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: game-ports-controller
subjects:
  - kind: ServiceAccount
    name: game-ports-controller
    namespace: {{ .Release.Namespace }}
