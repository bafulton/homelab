# The canary: a tiny UDP echo server, this app's own, not a Gameplane
# GameServer. The controller sends it a packet at its public address
# (values.yaml, canary), out through the edge and back, to check DNS, the
# edge, the tailnet grant and the gateway together (see game_ports.py). Its
# route to this Service is static (templates/gateway.yaml,
# game_ports.py's canary_route), so it needs no discovery.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-ports-canary
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: game-ports-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: game-ports-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: game-ports-canary
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: echo
          image: "{{ .Values.canary.image.repository }}:{{ .Values.canary.image.tag }}"
          imagePullPolicy: IfNotPresent
          command: [python, -u, -c]
          args:
            - |
              import socket
              s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              s.bind(("0.0.0.0", {{ .Values.canary.port }}))
              while True:
                  data, addr = s.recvfrom(2048)
                  s.sendto(b"game-ports-canary:" + data, addr)
          ports:
            - { name: echo, containerPort: {{ .Values.canary.port }}, protocol: UDP }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources: {{- toYaml .Values.canary.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: game-ports-canary
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: game-ports-canary
  ports:
    - { name: echo, port: {{ .Values.canary.port }}, protocol: UDP }
