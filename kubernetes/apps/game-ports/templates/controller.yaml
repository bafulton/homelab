# The controller (images/game-ports): writes the gateway's routes from
# Gameplane's port-pool Services, and runs the canary check.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-ports-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: game-ports-controller
spec:
  replicas: 1
  # Two controllers would both write the routes ConfigMap at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: game-ports-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: game-ports-controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.controller.metricsPort }}"
    spec:
      serviceAccountName: game-ports-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: GAME_PORTS_CONFIG
              value: {{ include "game-ports.config" . | quote }}
          ports:
            - { name: metrics, containerPort: {{ .Values.controller.metricsPort }}, protocol: TCP }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources: {{- toYaml .Values.controller.resources | nindent 12 }}
