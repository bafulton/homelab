# The edge forwarder's upstream on the tailnet, game-ports: every public
# port of every game, to the gateway.
apiVersion: v1
kind: Service
metadata:
  name: game-ports
  namespace: {{ .Release.Namespace }}
  annotations:
    tailscale.com/hostname: {{ .Values.tailscale.hostname }}
    tailscale.com/tags: {{ .Values.tailscale.tags }}
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: game-ports-gateway
  ports:
    {{- range $port := include "game-ports.ports" . | trim | splitList "\n" }}
    - name: p-{{ $port }}
      port: {{ $port }}
      targetPort: {{ $port }}
      protocol: UDP
    {{- end }}
