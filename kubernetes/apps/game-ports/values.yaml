# Routes the OCI edge's forwarded game ports to Gameplane servers that draw
# from a port pool (the gameplane app's operator.portPools), and runs a
# canary check of the whole path. See README.md.
#
# Access:
#   - Public: <game>.fultonhuffman.com:<port>, via the OCI edge forwarder
#     (opentofu/oci-forwarder, var.games "valheim" and "factorio"), which
#     reaches the gateway's Tailscale Service, game-ports.

# Ranges must match the gameplane app's operator.portPools, var.games
# (opentofu/oci-forwarder) and the tag:edge grant in tailscale/policy.hujson;
# CI checks that they all agree (.github/scripts/check_game_ports.py).
# Hostnames must match the gameplane app's gamePorts.hostnames: the
# controller publishes them as each pool Service's load-balancer address
# (game_ports.py, publish_address), so adding a pool-routed game needs a
# matching entry there too, with the same loadBalancerClass below.
pools:
  - name: valheim
    hostname: valheim.fultonhuffman.com
    from: 2456
    to: 2467
  - name: factorio
    hostname: factorio.fultonhuffman.com
    from: 34197
    to: 34202

# The game servers' namespace, the label Gameplane's operator puts on a pool
# server's Service (operator/internal/controller/gameserver_portpool.go,
# PortPoolServiceLabel), and the loadBalancerClass the gameplane app's
# policy gives that Service (GameplanePanel/Gameplane#1000), which makes
# this controller its load balancer.
gamesNamespace: gameplane-games
poolLabel: gameplane.local/port-pool
loadBalancerClass: homelab.io/game-ports

# The edge forwarder's upstream on the tailnet. The tag is the target of
# tailscale/policy.hujson's tag:edge grant.
tailscale:
  hostname: game-ports
  tags: tag:k8s-games

gateway:
  image:
    repository: traefik
    tag: v3.8.0
  # How long Traefik keeps a player's UDP session with no packets. Games send
  # many packets a second, so this only needs to cover a stall.
  udpTimeout: 60s
  resources:
    requests:
      cpu: 20m
      memory: 48Mi
    limits:
      memory: 128Mi

# A static UDP echo server (templates/canary.yaml), not a Gameplane
# GameServer: this app's own health check, independent of Gameplane. Every
# pass, the controller sends it a packet at its public address, out through
# the edge and back, checking DNS, the edge, the tailnet grant and the
# gateway together. The alert below fires when it hasn't answered in a
# while.
canary:
  hostname: game-ports-canary.fultonhuffman.com
  port: 39999
  image:
    repository: python
    tag: 3.15-alpine
  resources:
    requests: { cpu: 5m, memory: 16Mi }
    limits: { memory: 32Mi }

controller:
  metricsPort: 9100
  image:
    repository: ghcr.io/bafulton/game-ports
    tag: "2.0.0"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

signoz-alerts:
  alerts:
    # The canary echoes on every pass when all is well, so a gap means
    # something broke: most likely the edge, DNS or the tailnet grant lost a
    # port, or the gateway or controller is down.
    - name: Game Ports Checks Failing
      description: "Public Valheim and Factorio servers may be unreachable: game-ports' canary hasn't echoed in 15 minutes. See `kubectl -n game-ports logs deploy/game-ports-controller`."
      severity: warning
      type: promql
      query: 'time() - (max(game_ports_checks_last_success_timestamp_seconds) or vector(0))'
      op: ">"
      threshold: 900
      for: 10m0s
