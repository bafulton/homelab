# mc-router - one public Minecraft port for every Gameplane Minecraft server.
#
# Minecraft clients send the hostname they connect to, so mc-router routes
# fulton-fun.minecraft.fultonhuffman.com to the fulton-fun server. It finds
# servers by the mc-router.itzg.me/externalServerName annotation on their
# Services, which kubernetes/apps/gameplane adds to every Minecraft server.
#
# Access:
#   - Public: <server>.minecraft.fultonhuffman.com:25565, via the OCI edge
#     forwarder (opentofu/oci-forwarder, var.games "minecraft"), which reaches
#     this Service over Tailscale as game-minecraft.

namespace: mc-router

mc-router:
  image:
    repository: itzg/mc-router
    tag: "1.56.1"
    pullPolicy: IfNotPresent

  services:
    minecraft:
      type: LoadBalancer
      port: 25565
      # The edge forwarder's upstream, game-<key> in its var.games. The tag
      # is the target of tailscale/policy.hujson's tag:edge grant.
      annotations:
        tailscale.com/hostname: game-minecraft
        tailscale.com/tags: tag:k8s-games
    extraServiceSpec:
      loadBalancerClass: tailscale

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
