# Geyser's config.yml: only what differs from its defaults. Geyser rewrites
# the file on start, so the pod copies it into a writable volume first.
apiVersion: v1
kind: ConfigMap
metadata:
  name: geyser-config
  namespace: {{ .Release.Namespace }}
data:
  config.yml: |
    bedrock:
      address: 0.0.0.0
      # Signaling (TCP) and RakNet (UDP) share this port; NetherNet's WebRTC
      # traffic has its own UDP port.
      port: 19132
      webrtc-port: 19133
      # Recent Bedrock clients use NetherNet; RakNet serves older ones.
      transport: both
      signaling:
        mode: builtin
        # Players send WebRTC traffic to the edge, not this pod's addresses,
        # and STUN would find home's public address, which forwards nothing.
        advertise-addresses:
          - {{ .Values.geyser.publicHost }}
        stun-discovery: false
    java:
      # mc-router, in the same pod.
      address: 127.0.0.1
      port: 25565
      # Bedrock players join without a Java account; each server's Floodgate
      # plugin trusts them through the shared key.
      auth-type: floodgate
      # Send the hostname the Bedrock player used, so mc-router picks the
      # server by name, the same as for Java players.
      forward-hostname: true
    # The Bedrock server list shows these. Geyser would otherwise copy them
    # from its Java server, but mc-router routes by hostname and has no
    # server of its own to answer a ping, so Geyser warns every few seconds.
    motd:
      primary-motd: Fulton Minecraft
      secondary-motd: fultonhuffman.com
      passthrough-motd: false
      passthrough-player-counts: false
    advanced:
      floodgate-key-file: key.pem
    config-version: 12
