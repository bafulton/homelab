# The gateway on the LAN, for players at home: every <server>-minecraft.local
# name resolves here. The same ports as the Tailscale Service.
apiVersion: v1
kind: Service
metadata:
  name: minecraft-gateway-lan
  namespace: {{ .Release.Namespace }}
  annotations:
    metallb.io/loadBalancerIPs: {{ .Values.lanAddress | quote }}
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: minecraft-gateway
  ports:
    - { name: java, port: 25565, targetPort: java, protocol: TCP }
    - { name: signaling, port: 19132, targetPort: signaling, protocol: TCP }
    - { name: raknet, port: 19132, targetPort: raknet, protocol: UDP }
    - { name: nethernet, port: 19133, targetPort: nethernet, protocol: UDP }
