# Creates and chowns the bundle directory on beelink's USB disk before the PV
# mounts it.
#
# The BottleShip container runs as 1000:1000 and bundles are copied in as that
# user. fsGroup does not reliably apply ownership to hostPath volumes, so the
# directory is chowned here instead. Runs as a pre-install/pre-upgrade hook so
# the path exists by the time the PV's `type: Directory` check runs.
#
# This Job mounts /var/mnt/usb with type: Directory, so if the USB disk is not
# mounted the Job fails rather than seeding an empty directory on the root
# filesystem.
apiVersion: batch/v1
kind: Job
metadata:
  name: bottleship-permissions-fix
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        kubernetes.io/hostname: beelink
      containers:
        - name: fix-permissions
          # renovate: datasource=docker depName=busybox
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /mnt/bottleship
              chown 1000:1000 /mnt/bottleship
              chmod 755 /mnt/bottleship
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: usb-host
              mountPath: /mnt
      volumes:
        - name: usb-host
          hostPath:
            path: /var/mnt/usb
            type: Directory
