# GitOps-managed Home Assistant configuration
# Settings that used to live in configuration.yaml but belong in version control.
# This package is auto-applied via the home-assistant-packages ConfigMap.
# Changes here take effect on the next HA restart (triggered by the reloader).

# HTTP reverse-proxy settings are UI-managed (YAML is ignored): Settings >
# System > Network, stored in /config/.storage/http on the PVC. trusted_proxies
# holds every address Traefik's requests can arrive from at HA's hostNetwork
# port: 10.244.0.0/16 (pod CIDR), 192.168.1.0/24 (a home node's IP, after
# flannel masquerades pod traffic to a node address), and 100.64.0.0/10 (a
# remote node's Tailscale IP, the same masquerade from a Traefik on ocifree).

# Frontend themes
frontend:
  themes: !include_dir_merge_named themes

# Prometheus metrics endpoint for SigNoz. Requires auth (the default): HA
# listens on its node's LAN IP via hostNetwork, and the public route serves every
# path, so an open endpoint is readable from the LAN and the internet. SigNoz
# scrapes it with the "metrics" user's token (the home-assistant job in
# kubernetes/infra/signoz-k8s-infra/values.yaml).
prometheus:
