# Gives each Valheim and Factorio server, as it is created, everything the
# game-ports app (kubernetes/apps/game-ports) needs to publish its address:
#
#   - spec.networking.expose: LoadBalancer and loadBalancerClass
#     (gamePorts.loadBalancerClass), which makes game-ports' controller the
#     Service's load balancer instead of MetalLB (GameplanePanel/
#     Gameplane#1000). The server still draws its actual public ports from
#     a pool (operator.portPools above), not from this Service type.
#   - spec.networking.hostname (gamePorts.hostnames below), which the
#     controller publishes as that load balancer's address, so the
#     dashboard shows "<hostname>:<port>" instead of the Service's cluster
#     address and a separate hostname label (GameplanePanel/Gameplane#999).
#
# A server that sets its own hostname keeps it, and gets no loadBalancerClass
# from here either, so it is left to the cluster's default implementation.
{{- range $template, $host := .Values.gamePorts.hostnames }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: gameplane-game-ports-{{ $template }}
spec:
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $.Values.gameplane.gamesNamespace | default "gameplane-games" }}
    resourceRules:
      - apiGroups: [gameplane.local]
        apiVersions: [v1alpha1]
        operations: [CREATE]
        resources: [gameservers]
  matchConditions:
    - name: {{ $template }}-without-address
      expression: >-
        object.spec.templateRef.name == {{ $template | squote }} &&
        !(has(object.spec.networking) && has(object.spec.networking.hostname))
  # A server without an address is still a working server, so an error here
  # mustn't block creating one.
  failurePolicy: Ignore
  reinvocationPolicy: Never
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          (has(object.spec.networking) ? [] :
            [JSONPatch{op: "add", path: "/spec/networking", value: {}}]) +
          [
            JSONPatch{op: "add", path: "/spec/networking/expose", value: "LoadBalancer"},
            JSONPatch{op: "add", path: "/spec/networking/loadBalancerClass", value: {{ $.Values.gamePorts.loadBalancerClass | squote }}},
            JSONPatch{op: "add", path: "/spec/networking/hostname", value: {{ $host | squote }}}
          ]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: gameplane-game-ports-{{ $template }}
spec:
  policyName: gameplane-game-ports-{{ $template }}
---
{{- end }}
