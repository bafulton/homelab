# Hands the servers of port-routed games (Valheim, Factorio) to the game-ports
# app (kubernetes/apps/game-ports), which gives each its public ports and
# address. Their clients don't send a hostname, so unlike Minecraft each
# server needs public ports of its own.
#
#   - gameplane-game-ports-servers: each such server is a LoadBalancer, and
#     its Service carries the game-ports.homelab.io/game annotation. Kept on
#     update too: the Service's class only allows a LoadBalancer.
#   - gameplane-game-ports-services: that Service gets game-ports' load
#     balancer class as it is created, so game-ports, not MetalLB, gives it
#     its address. The class can't be added later, so a server created before
#     this policy keeps its LAN address until it is recreated.
{{- with .Values.gamePorts }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: gameplane-game-ports-servers
spec:
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $.Values.gameplane.gamesNamespace | default "gameplane-games" }}
    resourceRules:
      - apiGroups: [gameplane.local]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [gameservers]
  matchConditions:
    - name: port-routed-game
      expression: object.spec.templateRef.name in {{ toJson .templates | replace "\"" "'" }}
  variables:
    - name: annotations
      expression: >-
        has(object.spec.networking) && has(object.spec.networking.serviceAnnotations) ?
          object.spec.networking.serviceAnnotations : {}
  # A server that isn't public is still a working server, so an error here
  # mustn't block creating one.
  failurePolicy: Ignore
  reinvocationPolicy: Never
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          (has(object.spec.networking) ? [] :
            [JSONPatch{op: "add", path: "/spec/networking", value: {}}]) +
          [JSONPatch{op: "add", path: "/spec/networking/expose", value: "LoadBalancer"}] +
          (has(object.spec.networking) && has(object.spec.networking.serviceAnnotations) ? [] :
            [JSONPatch{op: "add", path: "/spec/networking/serviceAnnotations", value: {}}]) +
          [JSONPatch{op: "add", path: "/spec/networking/serviceAnnotations/game-ports.homelab.io~1game", value: object.spec.templateRef.name}]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: gameplane-game-ports-servers
spec:
  policyName: gameplane-game-ports-servers
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: gameplane-game-ports-services
spec:
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $.Values.gameplane.gamesNamespace | default "gameplane-games" }}
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [services]
  matchConditions:
    - name: port-routed-game-service
      expression: >-
        has(object.metadata.annotations) &&
        'game-ports.homelab.io/game' in object.metadata.annotations &&
        object.spec.type == 'LoadBalancer' &&
        !has(object.spec.loadBalancerClass)
  failurePolicy: Ignore
  reinvocationPolicy: Never
  # game-ports' gateway reaches the Service by its cluster IP, so it needs no
  # node ports.
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [
            JSONPatch{op: "add", path: "/spec/loadBalancerClass", value: {{ .loadBalancerClass | squote }}},
            JSONPatch{op: "add", path: "/spec/allocateLoadBalancerNodePorts", value: false}
          ]
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: gameplane-game-ports-services
spec:
  policyName: gameplane-game-ports-services
{{- end }}
