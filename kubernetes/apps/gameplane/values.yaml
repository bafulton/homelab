# Gameplane - a game server panel. Friends sign in with Pocket ID, then
# create, start, stop and manage their own servers from game templates.
# Servers are GameServer resources in gameplane-games, created at runtime,
# not kept in git. See README.md for the one-time setup and the trial plan.
#
# Access:
#   - Public: https://server-admin.fultonhuffman.com (via Cloudflare Tunnel),
#     signed in through Pocket ID (group `game-servers`)

namespace: gameplane-system

# The upstream chart sets CPU limits; the `cpu: null`s below remove them,
# which needs values.yaml passed as a values file (kubernetes/appsets/apps.yaml).
honorNulls: true

syncPolicy:
  # The CRDs are large.
  serverSideApply: true
  # Never prune: removing a CRD deletes every GameServer, and a GameServer
  # owns its world volume. The CRDs move to their own gameplane-crds app,
  # letting this one prune, once Gameplane publishes them as a chart:
  # https://github.com/GameplanePanel/Gameplane/issues/989
  prune: false

# Game templates whose images are amd64 only. Their pods are pinned to amd64
# nodes (templates/amd64-placement.yaml). Check a new template's image before
# installing it: Minecraft and Factorio are multi-arch.
amd64OnlyGames:
  - valheim
  - terraria

# New game servers sleep after this many minutes without players, and wake
# when a player joins (templates/idle-sleep.yaml). Owners change this per
# server in Settings -> Lifecycle.
idleSleep:
  afterMinutes: 30
  wakeOnConnect: true

# Minecraft servers get public names, <server>.<domain>, routed by mc-router
# (templates/minecraft-names.yaml). Only Minecraft gets this: a Minecraft
# Java client sends the hostname it's connecting to, so one public port can
# serve every server. Valheim, Factorio and Terraria clients don't, so each of
# their servers needs a public port of its own instead. templates lists the
# Minecraft Java game templates.
minecraftNames:
  domain: minecraft.fultonhuffman.com
  # The minecraft-gateway's LAN address, where each server's
  # <server>-minecraft.local name points. Must match lanAddress in
  # kubernetes/apps/minecraft-gateway.
  lanAddress: 192.168.1.250
  templates:
    - minecraft

# Gives each pool server its game's public address (templates/game-ports.yaml):
# a loadBalancerClass that makes the game-ports app's controller its load
# balancer, and the hostname it publishes there. loadBalancerClass must
# match the game-ports app's own value. A server that sets its own hostname
# keeps it.
gamePorts:
  loadBalancerClass: homelab.io/game-ports
  hostnames:
    valheim: valheim.fultonhuffman.com
    factorio: factorio.fultonhuffman.com

# Bedrock players join Paper Minecraft servers through Floodgate
# (templates/minecraft-floodgate.yaml), with the floodgate-key secret below.
floodgate:
  # The latest Floodgate for Paper/Spigot, downloaded on each server start.
  pluginUrl: https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
  initImage: busybox:1.38.0

gameplane:
  # Argo CD renders offline, so the chart can't look up the Secrets it would
  # otherwise generate. This profile has it use the mTLS Secrets in
  # templates/agent-mtls.yaml instead, and marks the games namespace and the
  # database volume to survive pruning and Application deletion.
  argoCD:
    enabled: true
  crds:
    autoApply:
      enabled: false

  # From 0.4.1 the default refuses any game whose template doesn't declare a
  # non-root user and group. Valheim, Factorio and Terraria's don't yet
  # (GameplanePanel/module#69), so keep the games namespace at baseline until
  # those templates are fixed, then turn this back on.
  podSecurity:
    enforceRestricted: false

  # Served by gateway-route below.
  ingress:
    enabled: false

  api:
    # No CPU limits in this cluster.
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: null, memory: 256Mi }
    # Users, roles and settings live in this SQLite database.
    storage:
      existingClaim: gameplane-api-data
    telemetry:
      enabled: false
    # Pocket ID decides who may sign in: the client only admits the
    # `game-servers` group. Gameplane's Helm-configured provider doesn't
    # request the `groups` scope, so it can't map groups to roles; everyone
    # who signs in is an operator, who can create and run servers. Admins
    # are promoted in the dashboard (README.md, "First admin").
    oidc:
      enabled: true
      issuer: https://auth.fultonhuffman.com
      clientID: "25ababfd-3f02-44fa-bc06-e351c7727316"
      clientSecretRef:
        name: gameplane-oidc
        key: clientSecret
      redirectURL: https://server-admin.fultonhuffman.com/auth/oidc/helm/callback
      displayName: Pocket ID
      defaultRole: operator
    agentMTLS:
      caSecretRef:
        name: gameplane-external-ca-v1
      clientCertRef:
        name: gameplane-external-client-v1

  operator:
    resources:
      requests: { cpu: 100m, memory: 64Mi }
      limits: { cpu: null, memory: 256Mi }
    # Worlds are replicated Longhorn volumes, so game servers can run on any
    # node, ocifree included.
    gameDataStorage:
      storageClassName: config
    # LAN servers can ask for a LoadBalancer address from MetalLB.
    addressManager: metallb
    metalLBNamespace: metallb
    # Valheim and Factorio clients send no hostname, so behind the OCI
    # edge's one public address each server needs ports of its own: the
    # operator hands them out from these pools (GameplanePanel/Gameplane
    # #1001) and keeps them for the server's life. The game-ports app
    # (kubernetes/apps/game-ports) routes each pool port to the server
    # holding it; its ranges must match these.
    portPools:
      - name: valheim
        ports: "2456-2467"
        templates: [valheim]
      - name: factorio
        ports: "34197-34202"
        templates: [factorio]

  web:
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { cpu: null, memory: 128Mi }

gateway-route:
  routes:
    - name: public
      access: apps
      hostnames:
        - server-admin.fultonhuffman.com  # Public via Cloudflare Tunnel
      service:
        name: gameplane-web
        port: 80

# The API's database. Every account and setting lives here, so it is a
# replicated `config` volume with nightly snapshots and an off-node backup.
longhorn-storage:
  pvcs:
    - name: gameplane-api-data
      size: 2Gi
      storageClass: config
      backupGroup: gameplane
  jobs:
    - name: gameplane-daily
      cron: "20 3 * * *"
      groups:
        - gameplane
      retain: 7
    - name: gameplane-backup
      task: backup
      cron: "50 3 * * *"
      groups:
        - gameplane
      retain: 7

bitwarden-secret:
  secrets:
    - name: gameplane-oidc
      data:
        # The Pocket ID client's secret (README.md, "Pocket ID client").
        clientSecret: "fd500808-4db3-4e05-98b3-b50100fab35a"
    # Floodgate's key, for the Paper servers' Floodgate plugin, in the games
    # namespace where they run. The same Bitwarden secret as the
    # minecraft-gateway's, whose Geyser vouches for Bedrock players with it.
    - name: floodgate-key
      namespace: gameplane-games
      decodingStrategy: Base64
      data:
        key.pem: "c86f4a8d-6e40-41d2-af7f-b5010158c59e"
