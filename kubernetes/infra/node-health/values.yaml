namespace: node-health

image:
  # Prebuilt toolbox (curl + jq) instead of `apk add` at container start, which
  # made every pod boot depend on Alpine's CDN. This DaemonSet had already died
  # that way: "DNS: transient error" -> "curl (no such package)".
  repository: ghcr.io/bafulton/homelab-toolbox
  # renovate: datasource=docker depName=ghcr.io/bafulton/homelab-toolbox
  tag: "1.0.1"
  pullPolicy: IfNotPresent

healthchecks:
  pingUrl: https://hc-ping.com
  # Ping interval in seconds (default: 2 minutes)
  interval: 120
  # Recommended grace period in healthchecks.io UI (informational)
  # Should be 2-3x the interval to handle temporary network issues
  gracePeriod: 300
  # Timeout for curl requests in seconds
  timeout: 10

resources:
  requests:
    memory: 16Mi
    cpu: 10m
  limits:
    memory: 64Mi

bitwarden-secret:
  secrets:
    - name: healthchecks-api-key
      data:
        api-key: "53627836-1ab1-47d6-a90c-b3e0003ceefd"
    - name: healthchecks-ping-key
      data:
        ping-key: "bb1e5466-8bee-4a27-a2d5-b3e00030a9f8"
