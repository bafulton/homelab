namespace: smartctl-exporter

prometheus-smartctl-exporter:
  # Use community multi-arch image (official image is amd64-only)
  # https://github.com/prometheus-community/smartctl_exporter/issues/105
  image:
    repository: ghcr.io/joryirving/smartctl_exporter
    tag: 0.15.0

  # Prometheus annotations for auto-discovery by signoz-k8s-infra
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9633"

  # Collect SMART data every 5 minutes. The exporter blocks its HTTP handler
  # during smartctl runs, so this has to stay comfortably above the scan time.
  #
  # This was 30 min, justified by "beelink has 10 USB drives and the full scan
  # takes ~14 minutes". That is no longer true: `smartctl --scan` finds two
  # devices on beelink (/dev/sda, /dev/nvme0) and one on rpi5. The eight
  # sdb-sdi entries are Longhorn's iSCSI VIRTUAL-DISK exports, which smartctl
  # correctly skips. A scan of two devices takes ~1s each.
  #
  # Fresher data matters: the Oct 2026 USB-link investigation was slowed by
  # 30-minute-old SMART samples.
  # This maps to --smartctl.interval in the binary.
  common:
    config:
      collect_not_more_than_period: 300s

  # Tolerate all taints to run on all nodes
  tolerations:
    - effect: NoSchedule
      operator: Exists

  resources:
    requests:
      memory: 32Mi
      cpu: 50m
    limits:
      memory: 128Mi
