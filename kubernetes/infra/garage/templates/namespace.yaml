# privileged is required only by the permissions-fix Job, which mounts
# /var/mnt/usb as a direct hostPath to chown the Garage directories. Baseline
# PodSecurity blocks direct hostPath volumes in pod specs but permits PVCs
# backed by hostPath PVs, which is how Garage itself gets its storage.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels:
    pod-security.kubernetes.io/enforce: privileged
