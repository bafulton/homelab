# Garage - S3-compatible object storage
#
# Replaces MinIO, whose images were pulled from every public registry when the
# project was archived (Apr 2026). Serves two consumers:
#   - Longhorn volume backups  (backupTarget s3://longhorn-backups@us-east-1/)
#   - VolSync restic backups   (jellyfin-media, which is hostPath, not Longhorn)
#
# Upstream chart is datahub-local/garage-helm, a fork of the in-repo Deuxfleurs
# chart that adds a declarative bootstrap job (layout + buckets + keys). The
# official chart is not published to any Helm repo or OCI registry, so it cannot
# be a chart-of-charts dependency. The container image is upstream's
# dxflrs/garage either way - the fork ships templates only, no binaries.
#
# See README.md for the credential layout and the MinIO migration history.

namespace: garage

# The upstream chart stamps checksum/secret on the pod template by hashing
# garage.secret.content, which falls back to randHex(64) for any value not set
# in values.yaml. Because rpcSecret and adminToken come from an external Secret
# (garage.secret.create: false), that hash is different on every render, so
# ArgoCD saw a changed pod template and rolled garage-0 on every single sync.
# checksum/config is computed the same way but over garage.toml, which is
# deterministic, so it is left alone and still triggers a roll on real config
# changes.
#
# REMOVE THIS BLOCK once the chart is bumped past 0.8.0.
# Fixed upstream in datahub-local/garage-helm#51 (merged 2026-10-19), which
# omits checksum/secret entirely when the secret content is not derived from
# values - exactly our case. It covers both workload.yaml and
# webui-deployment.yaml. No release has been cut yet: 0.8.0 is still the latest
# published chart and does not contain the fix.
#
# Note for whoever removes it: with the fix in place there is no checksum/secret
# annotation at all here, so rotating rpcSecret/adminToken in Bitwarden will no
# longer roll the pods by itself - that needs a manual restart. Upstream issue
# #50 stays open for its second case (garage.secret.create: true), which we do
# not use.
ignoreDifferences:
  - group: apps
    kind: StatefulSet
    name: garage
    jsonPointers: ["/spec/template/metadata/annotations/checksum~1secret"]
  # The webui Deployment stamps the same annotation from the same helper, so it
  # rolled on every sync too (6 ReplicaSets in 11 hours before this was caught).
  - group: apps
    kind: Deployment
    name: garage-webui
    jsonPointers: ["/spec/template/metadata/annotations/checksum~1secret"]

# Both secrets are consumed by the garage subchart:
#   garage-secret         -> garage.secret.name (rpcSecret + adminToken)
#   garage-s3-credentials -> clusterConfig.keys.longhorn-backup.secretName
#
# AWS_ACCESS_KEY_ID is a literal: Garage key IDs are public identifiers (like a
# username), and the bitwarden-secret chart only resolves UUID-shaped values.
bitwarden-secret:
  secrets:
    - name: garage-secret
      data:
        rpcSecret: "47d36e14-99a8-4e19-8476-b4e7015113d0"
        adminToken: "5fb33d5f-8ee5-4533-80e9-b4e7015137df"
    - name: garage-s3-credentials
      data:
        AWS_ACCESS_KEY_ID: "GK692f81c1982632383b08d5ff"
        AWS_SECRET_ACCESS_KEY: "154f9f3f-ec4f-40d8-8ae1-b4e701515074"

garage:
  # Garage's own configuration (renders to garage.toml)
  garage:
    # Single node, single disk: this IS the backup copy, the primaries live in
    # the cluster. Must stay in step with deployment.replicaCount below.
    replicationFactor: "1"

    # lmdb is the default and wants fsync-friendly storage; the USB disk is a
    # SanDisk Extreme SSD, so this is fine. Do not move meta onto the SD card.
    dbEngine: "lmdb"

    # Matches the region Longhorn already signs with, so the existing
    # backupTarget string (s3://longhorn-backups@us-east-1/) is unchanged.
    s3:
      api:
        region: "us-east-1"

    # rpcSecret and adminToken come from Bitwarden via the secret above. Letting
    # the chart generate them would re-randomise on every ArgoCD render and
    # churn the pod, so create: false is deliberate.
    secret:
      create: false
      name: garage-secret

  deployment:
    # StatefulSet, not DaemonSet: the bootstrap job resolves nodes by
    # StatefulSet ordinal DNS (garage-0.garage-headless...). A DaemonSet has no
    # ordinal hostnames and the job would wait forever.
    kind: StatefulSet
    # Must be 1. The bootstrap job walks one host per replica, so the chart
    # default of 3 leaves it polling garage-1 and garage-2 indefinitely.
    replicaCount: 1

  # storageClass "" makes volumeClaimTemplates emit no storageClassName, so the
  # PVCs bind to the static hostPath PVs in templates/storage.yaml rather than
  # waiting on a provisioner (the cluster has no default StorageClass).
  #
  # Sizes are generous on purpose: volumeClaimTemplates are immutable, so
  # growing them later would require recreating the StatefulSet. Garage's own
  # usable capacity is set by clusterConfig.layout.capacity, which IS adjustable
  # at runtime.
  persistence:
    enabled: true
    meta:
      storageClass: ""
      size: 10Gi
    data:
      storageClass: ""
      size: 1700Gi

  # Pin to rpi5, which holds the USB disk this data lives on. Pinned by
  # hostname rather than storage.homelab.io/usb because beelink carries that
  # label too (for the jellyfin-media disk at its own /var/mnt/usb). The PVs in
  # templates/storage.yaml carry matching nodeAffinity, so the volumes are the
  # hard constraint and this selector keeps the scheduler honest about it.
  nodeSelector:
    kubernetes.io/hostname: rpi5

  # Declarative bootstrap: assigns the cluster layout, creates both buckets, and
  # imports the S3 key from garage-s3-credentials. Runs as a post-install/
  # post-upgrade hook and is idempotent (every garage command is `|| true`).
  clusterConfig:
    enabled: true
    layout:
      enabled: true
      zone: rpi5
      # Leaves headroom beside the cold minio-data tree (~601 GiB) on the 2 TB
      # disk. Raise with `garage layout assign -c` after minio-data is removed.
      capacity: 1200G
    buckets:
      - name: longhorn-backups
      - name: volsync-backups
    keys:
      longhorn-backup:
        secretName: garage-s3-credentials
        keyId: AWS_ACCESS_KEY_ID
        secretKey: AWS_SECRET_ACCESS_KEY
        buckets:
          - longhorn-backups
          - volsync-backups

  # Bucket/key/usage browser, replacing the old MinIO console. Exposed only on
  # catfish-mountain.com, which is wildcard_public = false, so it resolves
  # solely through Tailscale Split DNS - the same trust boundary as the
  # Longhorn dashboard. Chart-level basic auth is therefore left off.
  webui:
    enabled: true

  # Repo convention: requests for cpu+memory, a hard limit on memory only.
  # Never a CPU limit (CFS throttling on idle cores).
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

gateway-route:
  routes:
    - name: private
      hostnames:
        - garage.catfish-mountain.com
      service:
        name: garage-webui
        port: 3909
