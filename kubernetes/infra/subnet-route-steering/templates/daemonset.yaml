apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: subnet-route-steering
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: subnet-route-steering
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: subnet-route-steering
  template:
    metadata:
      labels:
        app.kubernetes.io/name: subnet-route-steering
    spec:
      serviceAccountName: subnet-route-steering
      # hostNetwork so `ip rule` acts on the node's routing policy, not a pod
      # netns. Home nodes reach the API ClusterIP (10.96.0.1) over the LAN via
      # kube-proxy, so kubectl's in-cluster config works with default DNS.
      hostNetwork: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: steering
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
{{ .Files.Get "files/reconcile.sh" | indent 14 }}
          env:
            - name: ENABLED
              value: {{ .Values.enabled | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SELECTOR
              value: {{ .Values.localNodeSelector | quote }}
            - name: LANCIDR
              value: {{ .Values.localLanCIDR | quote }}
            - name: PRIORITY
              value: {{ .Values.rulePriority | quote }}
            - name: INTERVAL
              value: {{ .Values.reconcileInterval | quote }}
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
