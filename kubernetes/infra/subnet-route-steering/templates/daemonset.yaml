apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: subnet-route-steering
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: subnet-route-steering
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: subnet-route-steering
  template:
    metadata:
      labels:
        app.kubernetes.io/name: subnet-route-steering
    spec:
      serviceAccountName: subnet-route-steering
      # hostNetwork so `ip route`/`ip rule` act on the node's routing tables, not
      # a pod netns. Home nodes reach the API ClusterIP (10.96.0.1) over the LAN
      # via kube-proxy, so kubectl's in-cluster config works with default DNS -
      # no apiServer override and no dnsConfig (unlike kilo, which ran on the
      # remote node too).
      hostNetwork: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: steering
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -u
              echo "subnet-route-steering: iface=$IFACE table=$TABLE priority=$PRIORITY selector='$SELECTOR' interval=${INTERVAL}s"
              while true; do
                if ip link show "$IFACE" >/dev/null 2>&1; then
                  # Discover remote nodes' pod CIDRs - never hardcoded. A new
                  # remote node is picked up on the next tick with no values edit.
                  cidrs=$(kubectl get nodes -l "$SELECTOR" \
                    -o jsonpath='{range .items[*]}{.spec.podCIDR}{"\n"}{end}' 2>/dev/null)
                  for cidr in $cidrs; do
                    [ -n "$cidr" ] || continue
                    # Route the remote CIDR onto tailscale0, in a side table so it
                    # never touches main. The ip rule (priority after Tailscale's
                    # 5250 fwmark rule) steers only this CIDR into that table, so
                    # Tailscale's own marked disco packets fall through to the LAN
                    # default route instead of looping through tailscale0.
                    ip route replace "$cidr" dev "$IFACE" table "$TABLE"
                    ip rule list | grep -q "to $cidr lookup $TABLE" \
                      || ip rule add to "$cidr" table "$TABLE" priority "$PRIORITY"
                  done
                else
                  echo "subnet-route-steering: $IFACE not present yet, skipping tick"
                fi
                sleep "$INTERVAL"
              done
          env:
            - name: IFACE
              value: {{ .Values.tailscaleIface | quote }}
            - name: TABLE
              value: {{ .Values.routeTable | quote }}
            - name: PRIORITY
              value: {{ .Values.rulePriority | quote }}
            - name: SELECTOR
              value: {{ .Values.remoteNodeSelector | quote }}
            - name: INTERVAL
              value: {{ .Values.reconcileInterval | quote }}
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
