apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: subnet-route-steering
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: subnet-route-steering
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: subnet-route-steering
  template:
    metadata:
      labels:
        app.kubernetes.io/name: subnet-route-steering
    spec:
      serviceAccountName: subnet-route-steering
      # hostNetwork so `ip rule` acts on the node's routing policy, not a pod
      # netns. Home nodes reach the API ClusterIP (10.96.0.1) over the LAN via
      # kube-proxy, so kubectl's in-cluster config works with default DNS.
      hostNetwork: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: steering
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -u
              echo "subnet-route-steering: enabled=$ENABLED node=$NODE_NAME selector='$SELECTOR' priority=$PRIORITY interval=${INTERVAL}s"
              while true; do
                if [ "$ENABLED" = "true" ]; then
                  # Pin the home LAN to main so home<->home node traffic (and
                  # flannel's VXLAN underlay, keyed on node IPs) stays on the LAN
                  # even though each node accepts the others' advertised node /32.
                  ip rule list | grep -q "to $LANCIDR lookup main" \
                    || ip rule add to "$LANCIDR" table main priority "$PRIORITY"
                  # Discover the OTHER local nodes' pod CIDRs (never hardcoded;
                  # a new local node is picked up on the next tick) and pin each
                  # to the main table, where flannel's LAN route wins over the
                  # Tailscale-accepted route in table 52. Our own node is skipped
                  # - its pods are local (cni0), never routed off-box.
                  kubectl get nodes -l "$SELECTOR" \
                    -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.podCIDR}{"\n"}{end}' 2>/dev/null \
                    | while read -r name cidr; do
                        [ -n "$cidr" ] || continue
                        if [ "$name" = "$NODE_NAME" ]; then continue; fi
                        ip rule list | grep -q "to $cidr lookup main" \
                          || ip rule add to "$cidr" table main priority "$PRIORITY"
                      done
                else
                  # Disabled: remove anything we added, then idle (clean rollback).
                  while ip rule del priority "$PRIORITY" 2>/dev/null; do :; done
                fi
                sleep "$INTERVAL"
              done
          env:
            - name: ENABLED
              value: {{ .Values.enabled | quote }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: SELECTOR
              value: {{ .Values.localNodeSelector | quote }}
            - name: LANCIDR
              value: {{ .Values.localLanCIDR | quote }}
            - name: PRIORITY
              value: {{ .Values.rulePriority | quote }}
            - name: INTERVAL
              value: {{ .Values.reconcileInterval | quote }}
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
