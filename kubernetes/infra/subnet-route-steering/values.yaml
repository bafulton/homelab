# Keeps LOCAL (home) node pod traffic on the bare LAN (flannel), even though the
# home nodes run --accept-routes.
#
# The home nodes MUST accept routes: that is how they reach the remote node's
# pods natively, via Tailscale's own table 52 (ip rule 5270) - fast and
# flap-free, verified. But once the home nodes also advertise their own pod
# /24s, each one accepts the OTHER home node's /24 into table 52 as well, which
# would send local<->local pod traffic over Tailscale and break the hard
# invariant that it rides the bare LAN and survives a full home-internet outage.
#
# This DaemonSet closes that gap: on each local node it adds a higher-priority
# ip rule (5260, before table 52's 5270) that sends every OTHER local node's pod
# CIDR to the main table, where flannel's LAN route wins. Remote pod traffic has
# no such override, so it falls through to table 52 and rides Tailscale.
#
# (Under a real internet outage the point is moot anyway: Tailscale drops its
# routes, table 52 empties, and local<->local falls back to flannel on its own.
# The override matters only while Tailscale is up.)
namespace: kube-system

# false => the loop instead REMOVES the rules it added, then idles (clean rollback).
enabled: true

image:
  repository: ghcr.io/bafulton/homelab-toolbox
  # renovate: datasource=docker depName=ghcr.io/bafulton/homelab-toolbox
  tag: "1.0.3"
  pullPolicy: IfNotPresent

# Runs on local nodes only. The remote node needs none of this.
nodeSelector:
  homelab.io/location: local

# Discover the local nodes (this one excluded) whose pod CIDRs must stay on the
# LAN. Dynamic, so a new local node is picked up with no values edit.
localNodeSelector: "homelab.io/location=local"

# Must sit after Tailscale's fwmark rules (<=5250) and before its table-52 rule
# (5270), so only these local CIDRs are pulled back to the LAN.
rulePriority: "5260"
reconcileInterval: "30"

resources:
  requests:
    cpu: 5m
    memory: 16Mi
  limits:
    memory: 32Mi
