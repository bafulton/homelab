apiVersion: v2
name: subnet-route-steering
description: >-
  Home-node companion to the Tailscale subnet-route pod mesh (the Kilo
  replacement). A tiny NET_ADMIN DaemonSet on local nodes that pins each OTHER
  local node's pod CIDR to the main table (flannel/LAN) with an ip rule above
  Tailscale's table-52 rule - so local<->local pod traffic rides the bare LAN
  even though the nodes run --accept-routes, while remote pod traffic falls
  through to table 52 and rides Tailscale.
type: application
version: 1.0.0
