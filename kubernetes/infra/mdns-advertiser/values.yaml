namespace: mdns-advertiser

image:
  repository: python
  # renovate: datasource=docker depName=python versioning=docker
  tag: 3.15-alpine
  pullPolicy: IfNotPresent

# Services are now configured in individual apps using the mdns-service shared chart.
# The advertiser discovers ConfigMaps with label: mdns.homelab.io/advertise=true

resources:
  requests:
    memory: 128Mi
    cpu: 10m
  limits:
    # 128Mi was too tight once the base image moved to python:3.15-alpine (#474):
    # the runtime `pip install` of zeroconf + kubernetes + pyyaml OOMKilled the
    # container in a loop, so mDNS records never stayed registered.
    memory: 256Mi
