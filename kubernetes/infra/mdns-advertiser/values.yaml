namespace: mdns-advertiser

image:
  # Built from images/mdns-advertiser/ by .github/workflows/build-images.yaml.
  # Deps are resolved at build time, so a base-image bump fails CI instead of
  # OOM-looping the advertiser and taking every .local record down with it.
  repository: ghcr.io/bafulton/mdns-advertiser
  # renovate: datasource=docker depName=ghcr.io/bafulton/mdns-advertiser
  tag: 1.2.0
  pullPolicy: IfNotPresent

# Records come from annotations on the objects being advertised: Services
# annotated mdns.homelab.io/hostname, and HTTPRoutes annotated
# mdns.homelab.io/advertise (see the image's advertiser.py and this app's
# README). ConfigMaps labeled mdns.homelab.io/advertise=true, the older form,
# still work until every app has moved.

resources:
  requests:
    memory: 64Mi
    cpu: 10m
  limits:
    memory: 128Mi
