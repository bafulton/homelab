namespace: mdns-advertiser

image:
  # Built from images/mdns-advertiser/ by .github/workflows/build-images.yaml.
  # Deps are resolved at build time, so a base-image bump fails CI instead of
  # OOM-looping the advertiser and taking every .local record down with it.
  repository: ghcr.io/bafulton/mdns-advertiser
  # renovate: datasource=docker depName=ghcr.io/bafulton/mdns-advertiser
  tag: 1.0.0
  pullPolicy: IfNotPresent

# Services are configured in individual apps using the mdns-config library
# chart. The advertiser discovers ConfigMaps labeled mdns.homelab.io/advertise=true.

resources:
  requests:
    memory: 64Mi
    cpu: 10m
  limits:
    memory: 128Mi
