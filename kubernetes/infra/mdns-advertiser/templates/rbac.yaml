apiVersion: v1
kind: ServiceAccount
metadata:
  name: mdns-advertiser
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mdns-advertiser
rules:
  # Services annotated mdns.homelab.io/hostname.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["list", "watch"]
  # HTTPRoutes annotated mdns.homelab.io/advertise, published at their
  # Gateway's address.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mdns-advertiser
subjects:
  - kind: ServiceAccount
    name: mdns-advertiser
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: mdns-advertiser
  apiGroup: rbac.authorization.k8s.io
