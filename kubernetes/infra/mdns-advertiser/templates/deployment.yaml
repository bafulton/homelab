apiVersion: apps/v1
kind: Deployment
metadata:
  name: mdns-advertiser
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mdns-advertiser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mdns-advertiser
    spec:
      serviceAccountName: mdns-advertiser
      # Placement: local only — hostNetwork mDNS advertiser must be on a LAN node
      # to broadcast .local records. See charts/README.md "Placement".
      nodeSelector:
        homelab.io/location: local
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: mdns
          # Entrypoint and deps are baked into the image (images/mdns-advertiser/).
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
