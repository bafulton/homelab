namespace: kube-system

image:
  # Was bitnami/kubectl:latest, which publishes no semantic version tags (only
  # 'latest' + sha256 digests): Renovate couldn't track it, and with
  # IfNotPresent each node pinned whatever digest it happened to cache first.
  # The toolbox pins kubectl to one minor of the API server and is Renovate-
  # tracked. Its ENTRYPOINT is /bin/sh, not kubectl, so the pod-cleanup jobs
  # set an explicit `command: [kubectl]`; busybox sh/sort/awk cover the
  # ReplicaSet cleanup scripting that previously wanted bash.
  repository: ghcr.io/bafulton/homelab-toolbox
  # renovate: datasource=docker depName=ghcr.io/bafulton/homelab-toolbox
  tag: "1.0.3"
  pullPolicy: IfNotPresent

podCleanup:
  enabled: true
  succeededSchedule: "* * * * *"     # every minute
  failedSchedule: "0 * * * *"        # every hour (failed pods wait up to 1h before deletion)

replicasetCleanup:
  enabled: true
  schedule: "0 */6 * * *"            # every 6 hours
  keepPerDeployment: 3               # keep newest 3 old ReplicaSets per Deployment

# Weekly TRIM of the SSD-backed data filesystems. Talos schedules no periodic
# trim and these xfs mounts carry no `discard` option, so without this the
# drives never learn which blocks are free: every deleted block still looks
# live, which raises write amplification and wear. Longhorn's own trim-daily
# job only trims the filesystems *inside* its volumes (punching holes in the
# replica files); that space reaches the SSD only when the host filesystem is
# trimmed too. Both USB enclosures pass TRIM through (discard_max_bytes > 0).
#
# Sundays 06:30 UTC: after Longhorn's nightly backups (last at 05:30) and before
# the VolSync media backup (08:00). A trim briefly stalls I/O on its drive.
fstrim:
  enabled: true
  schedule: "30 6 * * 0"
  nodes:
    - name: beelink
      paths:
        - /var/mnt/nvme   # Longhorn nvme-disk
        - /var/mnt/usb    # Jellyfin media
        - /var/mnt/tm     # Time Machine
    - name: rpi5
      paths:
        - /var/mnt/usb    # Garage + Longhorn usb-disk

# Daily snapshot of etcd, the cluster's only copy of its state (single
# control-plane node, on beelink's eMMC), to Garage on rpi5. Restoring it
# brings back everything Git can't recreate: Longhorn's volume records and
# PV bindings, cert-manager's issued certificates, and the rest of the live
# objects. Recover with `talosctl bootstrap --recover-from`.
etcdBackup:
  enabled: true
  schedule: "15 4 * * *"   # 04:15 UTC, a quiet hour
  node: 192.168.1.86       # beelink, the only etcd member
  endpoint: http://garage.garage.svc.cluster.local:3900
  bucket: etcd-backups
  retention: 30d
  # Keep in step with the cluster's Talos version (talos/cluster.yaml).
  talosctl:
    repository: ghcr.io/siderolabs/talosctl
    # renovate: datasource=docker depName=ghcr.io/siderolabs/talosctl
    tag: v1.14.4
  rclone:
    repository: rclone/rclone
    # renovate: datasource=docker depName=rclone/rclone
    tag: "1.75.2"

# Garage S3 key for the etcd-backups bucket: the same key Longhorn and VolSync
# use (see kubernetes/infra/garage/values.yaml). The key ID is a literal; the
# secret is a Bitwarden UUID.
bitwarden-secret:
  secrets:
    - name: etcd-backup-s3
      data:
        AWS_ACCESS_KEY_ID: "GK692f81c1982632383b08d5ff"
        AWS_SECRET_ACCESS_KEY: "154f9f3f-ec4f-40d8-8ae1-b4e701515074"
