apiVersion: v1
kind: Service
metadata:
  name: traefik-admin-dashboard
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-admin-traefik-admin
  ports:
    - name: dashboard
      port: 8080
      targetPort: traefik
      protocol: TCP
