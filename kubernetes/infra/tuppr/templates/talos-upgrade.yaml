{{- if .Values.talos.upgradeEnabled }}
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  # Fixed name: a version bump edits this resource rather than creating a new
  # one, so tuppr re-runs it and there is never a stale plan left queued.
  name: talos
  {{- if .Values.talos.suspend }}
  annotations:
    tuppr.home-operations.com/suspend: "true"
  {{- end }}
spec:
  talos:
    version: {{ .Values.talosVersion }}
  policy:
    # talosctl drains the node itself (tuppr runs it with the control plane as
    # its endpoint, which is where it fetches the kubeconfig). Its drain retries
    # PDB-refused evictions, which Longhorn needs: the instance-manager PDB only
    # lifts once the pods using the node's volumes are gone. tuppr's own drain
    # (waitForVolumeDetach) gives up at the first refusal, so it is not used.
    # A drain that overruns this fails the upgrade without rebooting.
    drainTimeout: 10m
  # Evaluated before each node, so the next node waits until the previous one
  # is back and Longhorn has reattached its volumes.
  healthChecks:
    - apiVersion: v1
      kind: Node
      expr: status.conditions.exists(c, c.type == "Ready" && c.status == "True")
      timeout: 15m
    - apiVersion: longhorn.io/v1beta2
      kind: Volume
      namespace: longhorn
      # Detached volumes report "unknown", which is fine.
      expr: '!(status.robustness in ["degraded", "faulted"])'
      timeout: 15m
    # The storage rule (kubernetes/infra/longhorn/values.yaml): a volume either
    # has a second replica or is strict-local. A single-replica volume that
    # could run on another node would hold beelink's instance-manager PDB and
    # hang the drain; this makes the upgrade wait visibly instead.
    - apiVersion: longhorn.io/v1beta2
      kind: Volume
      namespace: longhorn
      expr: object.spec.numberOfReplicas >= 2 || object.spec.dataLocality == "strict-local"
      timeout: 15m
{{- end }}
