{{- if .Values.kubernetes.upgradeEnabled }}
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  # tuppr allows exactly one KubernetesUpgrade, upgraded by editing its
  # version, so the name must not change with the version.
  name: kubernetes
  {{- if .Values.kubernetes.suspend }}
  annotations:
    tuppr.home-operations.com/suspend: "true"
  {{- end }}
spec:
  kubernetes:
    version: {{ .Values.kubernetesVersion }}
  healthChecks:
    - apiVersion: v1
      kind: Node
      expr: status.conditions.exists(c, c.type == "Ready" && c.status == "True")
      timeout: 15m
    # The storage rule - see talos-upgrade.yaml.
    - apiVersion: longhorn.io/v1beta2
      kind: Volume
      namespace: longhorn
      expr: object.spec.numberOfReplicas >= 2 || object.spec.dataLocality == "strict-local"
      timeout: 15m
{{- end }}
