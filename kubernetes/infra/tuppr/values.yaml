namespace: tuppr

# Talos/Kubernetes versions for upgrades - Renovate updates these alongside talos/cluster.yaml
talosVersion: v1.14.4
kubernetesVersion: v1.37.2

# Each gate renders one upgrade resource (templates/) at the version above.
# With a gate on, merging a version bump makes tuppr roll it out; with it off,
# Renovate's bumps only change files and nodes are upgraded by hand.
#
# With the Talos gate on, tuppr moves every node to talosVersion in either
# direction - a node ahead of it is downgraded. Bump talosVersion to match the
# newest node before turning the gate on.
#
# `suspend` pauses a gate's upgrade in place (tuppr's suspend annotation).
# Use it to stop a run that is underway; turning the gate off instead deletes
# the resource mid-run.
talos:
  upgradeEnabled: true
  suspend: false

kubernetes:
  upgradeEnabled: true
  suspend: false

tuppr:
  # A complete list of values can be found here:
  # https://github.com/home-operations/tuppr/blob/main/charts/tuppr/values.yaml

  controller:
    metrics:
      enabled: true

  # Use cert-manager for webhook certificates (already installed in cluster)
  webhook:
    certManager:
      enabled: true

  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 128Mi
