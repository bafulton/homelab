namespace: tuppr

# Talos/Kubernetes versions for upgrades - Renovate updates these alongside talconfig.yaml
talosVersion: v1.13.4
kubernetesVersion: v1.36.2

# Each gate renders one upgrade CR (templates/) at the version above. With a
# gate off, Renovate still bumps the version but tuppr is never asked to act.
talos:
  # Off until `talosctl upgrade` has been run by hand on rpi5 once - it reached
  # its current version by re-flash, so the upgrade path is unexercised there.
  supportsRpi5: false

kubernetes:
  # Keep this in step with talos.supportsRpi5. Renovate bumps talosVersion and
  # kubernetesVersion in the same PR, and the compatibility check validates the
  # pair against each other - not against the Talos the nodes actually run. With
  # only this gate on, a new Kubernetes minor would land on nodes still on the
  # old Talos (Talos v1.13 supports Kubernetes up to v1.36).
  upgradeEnabled: false

tuppr:
  # A complete list of values can be found here:
  # https://github.com/home-operations/tuppr/blob/main/charts/tuppr/values.yaml

  controller:
    metrics:
      enabled: true

  # Use cert-manager for webhook certificates (already installed in cluster)
  webhook:
    certManager:
      enabled: true

  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 128Mi
