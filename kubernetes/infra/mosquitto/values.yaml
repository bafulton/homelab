namespace: mosquitto

mosquitto:
  # Placement: local only — LAN MQTT broker (LoadBalancer @ 192.168.1.202) whose
  # data lives on longhorn-emmc; a remote node has no Longhorn CSI to attach it.
  # See charts/README.md "Placement".
  nodeSelector:
    homelab.io/location: local

  # MetalLB LoadBalancer for LAN access (Theengs Gateway, etc.)
  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 64Mi

  service:
    type: LoadBalancer
    annotations:
      metallb.io/loadBalancerIPs: "192.168.1.202"
    ports:
      mqtt:
        enabled: true
        port: 1883

  # Broker configuration
  config:
    # Allow anonymous - LAN access only, no external exposure
    # Theengs Gateway and Home Assistant will connect without auth
    allowAnonymous: true
    logLevel: information

  # Persistence for retained messages and subscriptions.
  # STEP 1 OF 2: temporarily off so ArgoCD prunes the longhorn-emmc PVC.
  # storageClassName is immutable, so the claim has to be recreated to move
  # onto the `config` class. Re-enabled with existingClaim in step 2.
  persistence:
    enabled: false

# mDNS advertisement for MQTT broker discovery
# Allows Theengs Gateway and other devices to find the broker
mdnsServices:
  - name: Mosquitto
    hostname: mosquitto
    ip: 192.168.1.202
    port: 1883
    types:
      - type: _mqtt._tcp
