namespace: mosquitto

mosquitto:
  # Placement: local only — LAN MQTT broker (LoadBalancer @ 192.168.1.202) whose
  # data lives on a Longhorn volume; a remote node has no Longhorn CSI to attach it.
  # See charts/README.md "Placement".
  nodeSelector:
    homelab.io/location: local

  # MetalLB LoadBalancer for LAN access (Theengs Gateway, etc.)
  resources:
    requests:
      memory: 32Mi
      cpu: 10m
    limits:
      memory: 64Mi

  service:
    type: LoadBalancer
    annotations:
      metallb.io/loadBalancerIPs: "192.168.1.202"
    ports:
      mqtt:
        enabled: true
        port: 1883

  # Broker configuration
  config:
    # Allow anonymous - LAN access only, no external exposure
    # Theengs Gateway and Home Assistant will connect without auth
    allowAnonymous: true
    logLevel: information

  # Persistence for retained messages and subscriptions.
  # The claim is created by the longhorn-storage chart below rather than by this
  # chart, so it can carry the recurring-job-group label Longhorn needs for
  # scheduled snapshots and backups - the upstream chart can set PVC
  # annotations but not labels.
  persistence:
    enabled: true
    existingClaim: mosquitto-data

# mDNS advertisement for MQTT broker discovery
# Allows Theengs Gateway and other devices to find the broker
mdnsServices:
  - name: Mosquitto
    hostname: mosquitto
    ip: 192.168.1.202
    port: 1883
    types:
      - type: _mqtt._tcp

# PVC + backup schedule. mosquitto-data was previously created by the upstream
# chart with no backup at all; moving it here puts it on the
# `config` class and gives it the same snapshot/backup treatment as the other
# config volumes.
longhorn-storage:
  pvcs:
    - name: mosquitto-data
      size: 1Gi
      storageClass: config
      backupGroup: mosquitto
  jobs:
    - name: mosquitto-daily
      cron: "0 5 * * *"
      groups:
        - mosquitto
      retain: 5
    - name: mosquitto-backup
      task: backup
      cron: "30 5 * * *"
      groups:
        - mosquitto
      retain: 3
