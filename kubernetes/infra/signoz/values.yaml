namespace: signoz

dashboardSync:
  image:
    # Prebuilt toolbox (curl + jq + git + kubectl) instead of `apk add` at job
    # start, which made every run depend on Alpine's CDN and pulled an unpinned
    # kubectl that could drift from the API server.
    repository: ghcr.io/bafulton/homelab-toolbox
    # renovate: datasource=docker depName=ghcr.io/bafulton/homelab-toolbox
    tag: "1.0.3"
    pullPolicy: IfNotPresent

# Ignore Kubernetes runtime defaults that cause perpetual drift
ignoreDifferences:
  # ClickHouse operator metrics-exporter adds divisor: "0" defaults to resourceFieldRef
  - group: apps
    kind: Deployment
    name: signoz-clickhouse-operator
    jqPathExpressions:
      - .spec.template.spec.containers[].env[].valueFrom.resourceFieldRef.divisor

# Gateway API HTTPRoute for private access
gateway-route:
  routes:
    - name: ui
      hostnames:
        - signoz.catfish-mountain.com
      service:
        name: signoz
        port: 8080

# API token for loading dashboards/alerts via GitOps
# Create token in SigNoz: Settings → API Tokens → Generate
# Store in Bitwarden and update the secret ID below
bitwarden-secret:
  secrets:
    - name: signoz-api-token
      data:
        token: "fa8aa5d0-f1d2-4de3-a1a8-b3c9003c2a52"
    - name: signoz-smtp-credentials
      data:
        password: "3425e9f2-f25a-400b-bd62-b3ca003efc3f"

signoz:
  clusterName: homelab

  # Disable Helm hooks - ArgoCD handles sync waves differently
  # Without this, otel-collector waits for a sync-init job that never gets created
  # NOTE: the chart key is telemetryStoreMigrator, not schemaMigrator. This was
  # set as `schemaMigrator.upgradeHelmHooks` for a long time, which silently did
  # nothing - the chart has no such key - so the sync hook kept running.
  #
  # Its Job is an ArgoCD sync hook, and a failing hook wedges the whole app: the
  # sync blocks on "waiting for healthy state of batch/Job/..." and applies
  # nothing else, so pushing a fix does not recover it - the stuck operation has
  # to be terminated first. upgradeHelmHooks: false keeps it out of the sync.
  telemetryStoreMigrator:
    upgradeHelmHooks: false

  # All three SigNoz PVCs (ClickHouse, Zookeeper, SigNoz DB) are rebuildable
  # observability data, so they sit on `state` rather than `config`.
  global:
    storageClass: state

  clickhouse:
    # Placement: beelink only. Its volume is a single strict-local replica on beelink's
    # NVMe (the `state` class), so Longhorn will attach it nowhere else - and
    # if it could run elsewhere, its replica would stay in use through a beelink
    # drain and Longhorn's instance-manager PDB would hang every Talos upgrade
    # and safe-reboot-node.sh run behind it.
    nodeSelector:
      kubernetes.io/hostname: beelink
    persistence:
      enabled: true
      size: 50Gi
    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9363"
    # Disable ClickHouse system logs to save disk space (~6.5GB)
    # These are internal operational logs, not SigNoz observability data
    # Re-enable query_log temporarily if debugging slow queries
    files:
      config.d/disable_system_logs.xml: |
        <clickhouse>
          <query_log remove="1"/>
          <query_thread_log remove="1"/>
          <query_views_log remove="1"/>
          <processors_profile_log remove="1"/>
          <part_log remove="1"/>
          <trace_log remove="1"/>
          <metric_log remove="1"/>
          <asynchronous_metric_log remove="1"/>
          <asynchronous_insert_log remove="1"/>
          <zookeeper_log remove="1"/>
          <session_log remove="1"/>
          <blob_storage_log remove="1"/>
          <backup_log remove="1"/>
          <crash_log remove="1"/>
        </clickhouse>
    zookeeper:
      heapSize: 256
      # Placement: beelink only. Its volume is a single strict-local replica on beelink's
      # NVMe (the `state` class), so Longhorn will attach it nowhere else - and
      # if it could run elsewhere, its replica would stay in use through a beelink
      # drain and Longhorn's instance-manager PDB would hang every Talos upgrade
      # and safe-reboot-node.sh run behind it.
      nodeSelector:
        kubernetes.io/hostname: beelink
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9141"
      resources:
        requests:
          memory: 350Mi
          cpu: 25m
        limits:
          memory: 350Mi
    clickhouseOperator:
      podAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
    resources:
      requests:
        memory: 3Gi
        cpu: 900m
      limits:
        memory: 4Gi

  otelCollector:
    # Placement: local only — writes to the local ClickHouse; keep it beside the
    # store rather than shipping all telemetry cloud->home.
    nodeSelector:
      homelab.io/location: local
    podAnnotations:
      # SigNoz custom collector uses a non-standard telemetry schema; :8888 is
      # not reachable. Scrape annotation intentionally omitted to avoid
      # constant scrape failures in the OTel deployment logs.
      prometheus.io/scrape: "false"
    resources:
      requests:
        memory: 512Mi
        cpu: 150m
      limits:
        memory: 1536Mi
    # Metrics get their own batch processor with a 30s timeout (the chart's
    # shared `batch` flushes every 1s). Each flush is a ClickHouse insert and a
    # new data part that background merges later rewrite, so at 1s ClickHouse
    # took ~760 inserts/min and rewrote every row ~10x - most of the NVMe's
    # writes. Samples keep their collection timestamps, so stored data is
    # unchanged; the newest ~30s just shows up later. ~700 samples/s x 30s
    # stays under send_batch_size.
    #
    # Logs get 10s: they are small (~11 lines/s), so this mostly cuts insert
    # and part churn rather than bytes, and new lines show up in the log view
    # within 10s. Traces keep the chart's 1s `batch`. SigNoz's log-pipeline
    # injection over OpAMP recognizes `batch/<id>` names and keeps its
    # processors ahead of them.
    config:
      processors:
        batch/metrics:
          send_batch_size: 50000
          timeout: 30s
        batch/logs:
          send_batch_size: 50000
          timeout: 10s
      service:
        pipelines:
          metrics:
            processors: [batch/metrics]
          logs:
            processors: [batch/logs]

  signoz:
    # Placement: beelink only. Its volume is a single strict-local replica on beelink's
    # NVMe (the `state` class), so Longhorn will attach it nowhere else - and
    # if it could run elsewhere, its replica would stay in use through a beelink
    # drain and Longhorn's instance-manager PDB would hang every Talos upgrade
    # and safe-reboot-node.sh run behind it.
    nodeSelector:
      kubernetes.io/hostname: beelink
    persistence:
      enabled: true
      size: 1Gi
    env:
      # Alertmanager builds the links in alert notifications from this. The
      # SigNoz chart defaults it to http://localhost:8080, which makes the
      # "Source" link in every alert email dead and leaks localhost into the
      # ruleSource label (and therefore into the email subject).
      # Must use the chart's lowercase key, not the uppercase env-var name: the
      # chart renders its own known keys first, so an uppercase duplicate here
      # is silently dropped.
      signoz_alertmanager_signoz_external__url: "https://signoz.catfish-mountain.com"
      SIGNOZ_ALERTMANAGER_SIGNOZ_GLOBAL_SMTP__SMARTHOST: "smtp.gmail.com:587"
      SIGNOZ_ALERTMANAGER_SIGNOZ_GLOBAL_SMTP__FROM: "fulton.benjamin@gmail.com"
      SIGNOZ_ALERTMANAGER_SIGNOZ_GLOBAL_SMTP__AUTH__USERNAME: "fulton.benjamin@gmail.com"
      SIGNOZ_ALERTMANAGER_SIGNOZ_GLOBAL_SMTP__REQUIRE__TLS: "true"
      SIGNOZ_ALERTMANAGER_SIGNOZ_GLOBAL_SMTP__AUTH__PASSWORD:
        valueFrom:
          secretKeyRef:
            name: signoz-smtp-credentials
            key: password
    resources:
      requests:
        memory: 96Mi
        cpu: 10m
      limits:
        memory: 256Mi
