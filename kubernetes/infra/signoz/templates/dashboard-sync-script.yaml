apiVersion: v1
kind: ConfigMap
metadata:
  name: signoz-sync-script
  namespace: {{ .Release.Namespace }}
data:
  sync.sh: |
    #!/bin/sh
    set -e
    # curl, jq, git and kubectl are baked into the toolbox image.
    # Keep going after an item fails so the log identifies every problem, but
    # fail the Job at the end. Never prune after a failed source/list operation.
    : > /tmp/sync-errors
    fail() { echo "ERROR: $*" >&2; echo failed >> /tmp/sync-errors; }
    api() { curl -sS --connect-timeout 5 --max-time 20 "$@"; }
    api_response() {
      if ! response=$(api -w "\n%{http_code}" "$@"); then
        fail "SigNoz API transport error (curl exit; see preceding diagnostic)"
        response="000"
        return 1
      fi
    }

    # Clone repo with retries (DNS failures are intermittent)
    # Plain shallow clone avoids promisor remote fetch issues with --filter=blob:none --sparse
    echo "Cloning repository..."
    for i in $(seq 1 5); do
      rm -rf /repo
      if git clone --depth 1 "$REPO_URL" /repo; then
        break
      fi
      if [ "$i" -eq 5 ]; then
        echo "ERROR: Failed to clone repository after 5 attempts"
        exit 1
      fi
      delay=$((i * 10))
      echo "  Clone attempt $i failed, retrying in ${delay}s..."
      sleep "$delay"
    done
    cd /repo

    # Wait for SigNoz to be ready
    echo "Waiting for SigNoz API to be ready..."
    for i in $(seq 1 30); do
      if api -f "$SIGNOZ_URL/api/v1/health" > /dev/null 2>&1; then
        echo "SigNoz API is ready"
        break
      fi
      if [ "$i" -eq 30 ]; then fail "SigNoz API did not become ready"; exit 1; fi
      echo "  Attempt $i/30 - waiting..."
      sleep 5
    done

    # ── Hash cache ────────────────────────────────────────────────────────────
    # Load stored hashes from the signoz-sync-hashes ConfigMap into /tmp/hashes/.
    # Each entry is a file named by key (e.g. "dash-argocd-status") containing
    # the sha256 of the last successfully synced file/content. Dashboard and
    # alert hashes are retained for observability, but never used to skip a
    # write: a restored database can contain an older object with the same
    # name, while this ConfigMap still has the newest source hash.
    mkdir -p /tmp/hashes
    kubectl get configmap signoz-sync-hashes -n signoz -o json 2>/dev/null | \
      jq -r '.data // {} | to_entries[] | .key + "=" + .value' 2>/dev/null | \
      while read -r entry; do
        key="${entry%%=*}"
        val="${entry#*=}"
        printf '%s' "$val" > "/tmp/hashes/$key"
      done || true

    get_hash()    { cat "/tmp/hashes/$1" 2>/dev/null || true; }
    record_hash() { printf '%s' "$2" > "/tmp/hashes/$1"; }

    # ── Dashboards ────────────────────────────────────────────────────────────
    # NOTE: SigNoz removed the v1 dashboard API (v0.142.1) — this section uses
    # /api/v2/dashboards. Dashboard JSON files are the "postable" v2/Perses
    # shape: {tags, spec: {display, layouts, panels, variables, ...}[, image]}.
    # Alerts use /api/v3/rules (list) and /api/v2/rules (write) with the
    # v2alpha1 rule schema; the /api/v1/rules endpoints are being removed.
    # Track all IaC dashboard titles so we can reconcile at the end.
    # Dashboards with tag "gitops" that are NOT in this list will be deleted.
    : > /tmp/synced_dashboard_titles

    # Load dashboards (update existing or create new - preserves IDs for stable links)
    DASHBOARD_DIR="/repo/$REPO_PATH/dashboards"
    DASHBOARDS_OK=true
    if [ -d "$DASHBOARD_DIR" ] && ls "$DASHBOARD_DIR"/*.json 1> /dev/null 2>&1; then
      echo "Loading dashboards..."

      # Get existing dashboards
      api_response "$SIGNOZ_URL/api/v2/dashboards" -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN" || DASHBOARDS_OK=false
      existing=$(printf '%s\n' "$response" | sed '$d')
      if [ "$(printf '%s\n' "$response" | tail -n1)" != "200" ] ||
         ! printf '%s' "$existing" | jq -e '.data.dashboards | type == "array"' > /dev/null 2>&1; then
        DASHBOARDS_OK=false
        fail "GET /api/v2/dashboards failed or returned an invalid list; skipping dashboard writes and pruning"
      fi

      for f in "$DASHBOARD_DIR"/*.json; do
        [ -f "$f" ] || continue
        name=$(basename "$f" .json)
        title=$(jq -r '.spec.display.name // empty' "$f")
        if [ -z "$title" ]; then fail "dashboard $name has no title"; DASHBOARDS_OK=false; continue; fi
        echo "$title" >> /tmp/synced_dashboard_titles

        [ "$DASHBOARDS_OK" = "true" ] || continue

        # A cached hash is only safe when the destination still exists.
        existing_id=$(printf '%s' "$existing" | jq -r --arg t "$title" \
          '[.data.dashboards[] | select(.spec.display.name == $t) | .id] | first // empty')

        # Reassert desired content even when the cached hash matches: the DB
        # may have been restored independently of this ConfigMap.
        file_hash=$(sha256sum "$f" | cut -d' ' -f1)

        echo "  Loading dashboard: $name (title: $title)"

        if [ -n "$existing_id" ]; then
          echo "    Updating existing dashboard: $existing_id"
          api_response -X PUT "$SIGNOZ_URL/api/v2/dashboards/$existing_id" \
            -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d @"$f" || true
        else
          echo "    Creating new dashboard"
          api_response -X POST "$SIGNOZ_URL/api/v2/dashboards" \
            -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d @"$f" || true
        fi

        http_code=$(echo "$response" | tail -n1)
        body=$(echo "$response" | sed '$d')

        if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then
          echo "    Success"
          record_hash "dash-$name" "$file_hash"
        else
          fail "dashboard $name write: HTTP $http_code - $body"
        fi
      done
    else
      DASHBOARDS_OK=false
      fail "dashboard source directory is missing or empty"
    fi

    # Reconcile: delete gitops-managed dashboards removed from IaC.
    # Only touches dashboards with the "gitops" tag — manually created dashboards are never deleted.
    if [ "$DASHBOARDS_OK" = "true" ]; then
      echo "Reconciling dashboards..."
      api_response "$SIGNOZ_URL/api/v2/dashboards" -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN" || DASHBOARDS_OK=false
      all_dashboards=$(printf '%s\n' "$response" | sed '$d')
      if [ "$(printf '%s\n' "$response" | tail -n1)" != "200" ] ||
         ! printf '%s' "$all_dashboards" | jq -e '.data.dashboards | type == "array"' > /dev/null 2>&1; then
        DASHBOARDS_OK=false
        fail "dashboard discovery failed; refusing to prune"
      fi
    fi
    if [ "$DASHBOARDS_OK" = "true" ]; then
      printf '%s' "$all_dashboards" | jq -c '.data.dashboards[] | select(.tags[]? | .key == "tag" and .value == "gitops")' > /tmp/prune_dashboards
    else
      : > /tmp/prune_dashboards
    fi
    while read -r dash; do
      dash_uuid=$(echo "$dash" | jq -r '.id')
      dash_title=$(echo "$dash" | jq -r '.spec.display.name')

      if ! grep -qxF "$dash_title" /tmp/synced_dashboard_titles 2>/dev/null; then
        echo "  Deleting removed gitops dashboard: $dash_title ($dash_uuid)"
        api_response -X DELETE "$SIGNOZ_URL/api/v2/dashboards/$dash_uuid" \
          -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN" || true
        http_code=$(echo "$response" | tail -n1)
        if [ "$http_code" = "200" ]; then
          echo "    Deleted"
        else
          fail "dashboard $dash_title delete: HTTP $http_code"
        fi
      fi
    done < /tmp/prune_dashboards

    # ── Alerts ────────────────────────────────────────────────────────────────
    # Track all IaC alert names so we can reconcile at the end.
    # Rules with labels.source=gitops that are NOT in this list will be deleted.
    : > /tmp/synced_alert_names
    # GET /api/v3/rules defaults to 20 results. Read every page before any
    # upsert or prune; treating one page as the full inventory creates duplicate
    # rules for names on later pages. Fail closed if pagination is incomplete.
    RULES_LIST_OK=false
    fetch_rules() {
      RULES_LIST_OK=false
      echo '{"data":{"rules":[]}}' > /tmp/rules.json
      : > /tmp/rule-pages.jsonl
      _offset=0
      while :; do
        api_response "$SIGNOZ_URL/api/v3/rules?limit=200&offset=$_offset" \
          -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN" || return
        _code=$(printf '%s\n' "$response" | tail -n1)
        _page=$(printf '%s\n' "$response" | sed '$d')
        if [ "$_code" != "200" ] ||
           ! printf '%s' "$_page" | jq -e '(.data.rules | type == "array") and (.data.total | type == "number")' > /dev/null 2>&1; then
          fail "GET /api/v3/rules offset $_offset returned HTTP $_code or an invalid page"
          return
        fi
        _count=$(printf '%s' "$_page" | jq '.data.rules | length')
        _total=$(printf '%s' "$_page" | jq '.data.total')
        if [ "$_count" -eq 0 ] && [ "$_offset" -lt "$_total" ]; then
          fail "GET /api/v3/rules returned an empty page before total $_total"
          return
        fi
        printf '%s\n' "$_page" >> /tmp/rule-pages.jsonl
        _offset=$((_offset + _count))
        [ "$_offset" -lt "$_total" ] || break
      done
      if [ "$_offset" -ne "$_total" ] ||
         ! jq -s '{data:{rules:[.[].data.rules[]],total:.[-1].data.total}}' /tmp/rule-pages.jsonl > /tmp/rules.json; then
        fail "GET /api/v3/rules returned $_offset rules but reported $_total"
        return
      fi
      _unique=$(jq '[.data.rules[].id] | unique | length' /tmp/rules.json)
      if [ "$_unique" -ne "$_total" ]; then
        fail "GET /api/v3/rules returned duplicate or missing rule IDs"
        return
      fi
      RULES_LIST_OK=true
      echo "  Rule list: $_total existing rule(s)"
    }

    # Load alerts from ConfigMaps (label: signoz.homelab.io/alert=true)
    echo "Loading alerts from ConfigMaps..."

    # Get existing alerts
    fetch_rules
    existing_alerts=$(cat /tmp/rules.json)

    # List all ConfigMaps with the alert label.
    #
    # Capture into a file with an explicit success flag instead of piping
    # kubectl straight into jq: a `kubectl ... | jq | while` pipeline hides a
    # kubectl failure (only the final `while` exit counts, and there is no
    # pipefail), so a kube-API outage on this node would silently yield zero
    # desired alerts - and the reconcile below would then delete every gitops
    # alert. CONFIGMAPS_OK gates that prune so a load failure can't wipe alerts.
    CONFIGMAPS_OK=true
    if ! kubectl get configmaps -A -l signoz.homelab.io/alert=true -o json > /tmp/alert_cms.json 2>/tmp/cm_err; then
      CONFIGMAPS_OK=false
      fail "failed to list alert ConfigMaps ($(cat /tmp/cm_err)); refusing to prune"
    elif ! jq -e '.items | type == "array"' /tmp/alert_cms.json > /dev/null 2>&1; then
      CONFIGMAPS_OK=false
      fail "alert ConfigMap discovery returned an invalid list; refusing to prune"
    elif [ "$(jq '.items | length' /tmp/alert_cms.json)" -eq 0 ]; then
      CONFIGMAPS_OK=false
      fail "alert ConfigMap discovery returned zero items; refusing to prune"
    fi
    if [ "$CONFIGMAPS_OK" = "true" ]; then jq -c '.items[]' /tmp/alert_cms.json > /tmp/alert_cm_items; else : > /tmp/alert_cm_items; fi
    while read -r cm; do
      cm_name=$(echo "$cm" | jq -r '.metadata.name')
      cm_namespace=$(echo "$cm" | jq -r '.metadata.namespace')
      alert_json=$(echo "$cm" | jq -r '.data["alert.json"]')

      if [ -z "$alert_json" ] || [ "$alert_json" = "null" ]; then
        CONFIGMAPS_OK=false
        fail "ConfigMap $cm_namespace/$cm_name has no alert.json"
        continue
      fi

      alert_name=$(echo "$alert_json" | jq -r '.alert // empty')
      if [ -z "$alert_name" ]; then CONFIGMAPS_OK=false; fail "ConfigMap $cm_namespace/$cm_name has no alert name"; continue; fi
      echo "$alert_name" >> /tmp/synced_alert_names

      existing_id=$(printf '%s' "$existing_alerts" | jq -r --arg n "$alert_name" \
        '[.. | objects | select((.alert? == $n) and ((.id? // "") != "")) | .id] | first // empty')
      [ "$RULES_LIST_OK" = "true" ] || continue

      # Always reassert desired content after a possible DB restore.
      content_hash=$(printf '%s' "$alert_json" | sha256sum | cut -d' ' -f1)
      hash_key="alert-cm-$cm_namespace-$cm_name"

      echo "  Loading alert from ConfigMap: $cm_namespace/$cm_name (name: $alert_name)"

      if [ -n "$existing_id" ]; then
        echo "    Updating existing alert: $existing_id"
        api_response -X PUT "$SIGNOZ_URL/api/v2/rules/$existing_id" \
          -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN" \
          -H "Content-Type: application/json" \
          -d "$alert_json" || true
      else
        if [ "$RULES_LIST_OK" != "true" ]; then echo "    Skipping create: rule list unavailable, refusing to risk a duplicate"; continue; fi; echo "    Creating new alert"
        api_response -X POST "$SIGNOZ_URL/api/v2/rules" \
          -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN" \
          -H "Content-Type: application/json" \
          -d "$alert_json" || true
      fi

      http_code=$(echo "$response" | tail -n1)
      body=$(echo "$response" | sed '$d')

      if echo "$http_code" | grep -qE "^2[0-9][0-9]$"; then
        echo "    Success"
        record_hash "$hash_key" "$content_hash"
      else
        fail "alert ConfigMap $cm_namespace/$cm_name write: HTTP $http_code - $body"
      fi
    done < /tmp/alert_cm_items

    # Load alerts from git repo
    ALERT_DIR="/repo/$REPO_PATH/alerts"
    if [ -d "$ALERT_DIR" ] && ls "$ALERT_DIR"/*.json 1> /dev/null 2>&1; then
      echo "Loading alerts from git..."

      # Refresh existing alerts list
      fetch_rules
      existing_alerts=$(cat /tmp/rules.json)

      for f in "$ALERT_DIR"/*.json; do
        [ -f "$f" ] || continue
        name=$(basename "$f" .json)
        alert_name=$(jq -r '.alert // .data.alert // empty' "$f")
        if [ -z "$alert_name" ]; then fail "alert $name has no name"; continue; fi
        echo "$alert_name" >> /tmp/synced_alert_names

        existing_id=$(printf '%s' "$existing_alerts" | jq -r --arg n "$alert_name" \
          '[.. | objects | select((.alert? == $n) and ((.id? // "") != "")) | .id] | first // empty')
        [ "$RULES_LIST_OK" = "true" ] || continue

        # Always reassert desired content after a possible DB restore.
        file_hash=$(sha256sum "$f" | cut -d' ' -f1)

        echo "  Loading alert: $name (name: $alert_name)"

        if [ -n "$existing_id" ]; then
          echo "    Updating existing alert: $existing_id"
          api_response -X PUT "$SIGNOZ_URL/api/v2/rules/$existing_id" \
            -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d @"$f" || true
        else
          if [ "$RULES_LIST_OK" != "true" ]; then echo "    Skipping create: rule list unavailable, refusing to risk a duplicate"; continue; fi; echo "    Creating new alert"
          api_response -X POST "$SIGNOZ_URL/api/v2/rules" \
            -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d @"$f" || true
        fi

        http_code=$(echo "$response" | tail -n1)
        body=$(echo "$response" | sed '$d')

        if echo "$http_code" | grep -qE "^2[0-9][0-9]$"; then
          echo "    Success"
          record_hash "alert-$name" "$file_hash"
        else
          fail "alert $name write: HTTP $http_code - $body"
        fi
      done
    else
      echo "No alerts found in git"
    fi

    # Reconcile: delete gitops-managed alerts removed from IaC.
    # Only touches rules with labels.source == "gitops" — manually
    # created rules are never deleted.
    #
    # Fail-safe: never prune when the desired set is untrustworthy. If the alert
    # ConfigMap load failed (a kube-API outage on this node) or produced zero
    # names, deleting every gitops alert is far worse than leaving a stale one,
    # so skip the reconcile entirely. (This is exactly how a run on an isolated
    # node once wiped all alerts.)
    if [ "$CONFIGMAPS_OK" != "true" ]; then
      echo "Skipping alert reconcile: ConfigMap load failed - refusing to prune gitops alerts"
    elif [ ! -s /tmp/synced_alert_names ]; then
      echo "Skipping alert reconcile: zero desired alerts loaded - refusing to delete all gitops alerts"
    else
      echo "Reconciling alerts..."
      fetch_rules
      all_rules=$(cat /tmp/rules.json)
      if [ "$RULES_LIST_OK" = "true" ]; then
        printf '%s' "$all_rules" | jq -c '[.. | objects | select((.labels? | objects | .source) == "gitops") | select((.id? // "") != "") | select((.alert? // "") != "") | {id, alert}] | unique_by(.id) | .[]' > /tmp/prune_rules
      else
        : > /tmp/prune_rules
        echo "Skipping alert prune: rule discovery failed"
      fi

      while read -r rule; do
        rule_id=$(echo "$rule" | jq -r '.id')
        rule_name=$(echo "$rule" | jq -r '.alert')

        if ! grep -qxF "$rule_name" /tmp/synced_alert_names 2>/dev/null; then
          echo "  Deleting removed gitops alert: $rule_name ($rule_id)"
          api_response -X DELETE "$SIGNOZ_URL/api/v2/rules/$rule_id" \
            -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN" || true
          http_code=$(echo "$response" | tail -n1)
          if echo "$http_code" | grep -qE "^2[0-9][0-9]$"; then
            echo "    Deleted"
          else
            fail "alert $rule_name delete: HTTP $http_code"
          fi
        fi
      done < /tmp/prune_rules
    fi

    # ── Channels ──────────────────────────────────────────────────────────────
    # Reconcile notification-channel settings the SigNoz UI cannot express.
    #
    # Today that means the email Subject header. Alertmanager's default subject
    # template prints bare label values, so alert mail arrives titled
    # "<ruleId> (<alertname> <ruleSource> warning gitops warning)". The channels
    # API accepts email_configs[].headers, which overrides that - but the UI has
    # no field for headers, so saving the channel there silently drops it.
    # Re-asserting it on every run keeps it in place.
    #
    # Each channels/<name>.json is {"name": <channel name>, "headers": {...}}
    # and is merged onto the channel's live receiver config, so the large HTML
    # body template is preserved. A raw API PUT sends no test notification, but
    # only PUT when the live headers actually differ so a steady state is a no-op.
    CHANNEL_DIR="/repo/$REPO_PATH/channels"
    if [ -d "$CHANNEL_DIR" ] && ls "$CHANNEL_DIR"/*.json 1> /dev/null 2>&1; then
      echo "Reconciling notification channels..."

      api_response "$SIGNOZ_URL/api/v1/channels" -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN" || true
      all_channels=$(printf '%s\n' "$response" | sed '$d')
      if [ "$(printf '%s\n' "$response" | tail -n1)" != "200" ] ||
         ! printf '%s' "$all_channels" | jq -e '.data | type == "array"' > /dev/null 2>&1; then
        fail "GET /api/v1/channels failed or returned an invalid list"
        all_channels='{"data":[]}'
      fi

      for f in "$CHANNEL_DIR"/*.json; do
        [ -f "$f" ] || continue
        name=$(basename "$f" .json)
        channel_name=$(jq -r '.name // empty' "$f")

        channel_id=$(echo "$all_channels" | jq -r --arg n "$channel_name" \
          '.data[]? | select(.name == $n) | .id // empty' 2>/dev/null | head -1)
        if [ -z "$channel_id" ]; then
          fail "no SigNoz channel named '$channel_name' for channels/$name.json"
          continue
        fi

        api_response "$SIGNOZ_URL/api/v1/channels/$channel_id" -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN" || true
        current=$(printf '%s\n' "$response" | sed '$d' | jq -r '.data.data // empty' 2>/dev/null || true)
        if [ -z "$current" ] || [ "$current" = "null" ]; then
          fail "could not read channel $channel_name ($channel_id): HTTP $(printf '%s\n' "$response" | tail -n1)"
          continue
        fi

        if [ "$(printf '%s' "$current" | jq -r 'has("email_configs")')" != "true" ]; then
          fail "channel $channel_name is not an email channel"
          continue
        fi

        desired=$(printf '%s' "$current" | jq --slurpfile o "$f" \
          '.email_configs[0].headers = ((.email_configs[0].headers // {}) + $o[0].headers)')

        live_headers=$(printf '%s' "$current" | jq -cS '.email_configs[0].headers // {}')
        want_headers=$(printf '%s' "$desired" | jq -cS '.email_configs[0].headers')

        if [ "$live_headers" = "$want_headers" ]; then
          echo "  Skipping unchanged channel: $channel_name"
          continue
        fi

        # Guard against an endless re-PUT loop: if a previous run pushed this
        # exact override and SigNoz did not retain it, stop retrying instead of
        # rewriting every 5 minutes. Clears itself when the JSON file changes.
        want_hash=$(printf '%s' "$want_headers" | sha256sum | cut -d' ' -f1)
        if [ "$(get_hash "channel-$name-unsupported")" = "$want_hash" ]; then
          fail "channel $channel_name: headers were not retained by SigNoz on an earlier run"
          continue
        fi

        echo "  Updating channel: $channel_name ($channel_id)"
        api_response -X PUT "$SIGNOZ_URL/api/v1/channels/$channel_id" \
          -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN" \
          -H "Content-Type: application/json" \
          -d "$desired" || true
        http_code=$(echo "$response" | tail -n1)
        body=$(echo "$response" | sed '$d')

        if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
          fail "channel $channel_name write: HTTP $http_code - $body"
          continue
        fi

        # Confirm the override actually survived the round trip.
        api_response "$SIGNOZ_URL/api/v1/channels/$channel_id" -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN" || true
        after=$(printf '%s\n' "$response" | sed '$d' | jq -rcS '.data.data.email_configs[0].headers // {}' 2>/dev/null || true)
        if [ "$after" = "$want_headers" ]; then
          echo "    Success"
        else
          fail "channel $channel_name PUT accepted but headers were not retained (got: $after)"
          echo "             Recording as unsupported; will not retry until channels/$name.json changes."
          record_hash "channel-$name-unsupported" "$want_hash"
        fi
      done
    else
      echo "No channels found in git"
    fi

    # ── Save hash cache ───────────────────────────────────────────────────────
    # Persist updated hashes to ConfigMap for next run.
    hashes_json='{'
    first=true
    for hf in /tmp/hashes/*; do
      [ -f "$hf" ] || continue
      key=$(basename "$hf")
      val=$(cat "$hf")
      [ "$first" = "true" ] || hashes_json="$hashes_json,"
      hashes_json="${hashes_json}\"${key}\":\"${val}\""
      first=false
    done
    hashes_json="${hashes_json}}"

    printf '{"apiVersion":"v1","kind":"ConfigMap","metadata":{"name":"signoz-sync-hashes","namespace":"signoz"},"data":%s}\n' \
      "$hashes_json" | kubectl apply -f - > /dev/null

    if [ -s /tmp/sync-errors ]; then
      echo "Sync completed with $(wc -l < /tmp/sync-errors | tr -d ' ') error(s)" >&2
      exit 1
    fi
    echo "Sync complete!"
