apiVersion: v1
kind: ConfigMap
metadata:
  name: signoz-sync-script
  namespace: {{ .Release.Namespace }}
data:
  sync.sh: |
    #!/bin/sh
    set -e
    # curl, jq, git and kubectl are baked into the toolbox image.

    # Clone repo with retries (DNS failures are intermittent)
    # Plain shallow clone avoids promisor remote fetch issues with --filter=blob:none --sparse
    echo "Cloning repository..."
    for i in $(seq 1 5); do
      rm -rf /repo
      if git clone --depth 1 "$REPO_URL" /repo; then
        break
      fi
      if [ "$i" -eq 5 ]; then
        echo "ERROR: Failed to clone repository after 5 attempts"
        exit 1
      fi
      delay=$((i * 10))
      echo "  Clone attempt $i failed, retrying in ${delay}s..."
      sleep "$delay"
    done
    cd /repo

    # Wait for SigNoz to be ready
    echo "Waiting for SigNoz API to be ready..."
    for i in $(seq 1 30); do
      if curl -sf "$SIGNOZ_URL/api/v1/health" > /dev/null 2>&1; then
        echo "SigNoz API is ready"
        break
      fi
      echo "  Attempt $i/30 - waiting..."
      sleep 5
    done

    # ── Hash cache ────────────────────────────────────────────────────────────
    # Load stored hashes from the signoz-sync-hashes ConfigMap into /tmp/hashes/.
    # Each entry is a file named by key (e.g. "dash-argocd-status") containing
    # the sha256 of the last successfully synced file/content.  Only items whose
    # hash has changed are pushed to SigNoz, preventing spurious "updated"
    # notifications when nothing actually changed.
    mkdir -p /tmp/hashes
    kubectl get configmap signoz-sync-hashes -n signoz -o json 2>/dev/null | \
      jq -r '.data // {} | to_entries[] | .key + "=" + .value' 2>/dev/null | \
      while read -r entry; do
        key="${entry%%=*}"
        val="${entry#*=}"
        printf '%s' "$val" > "/tmp/hashes/$key"
      done || true

    get_hash()    { cat "/tmp/hashes/$1" 2>/dev/null || true; }
    record_hash() { printf '%s' "$2" > "/tmp/hashes/$1"; }

    # ── Dashboards ────────────────────────────────────────────────────────────
    # NOTE: SigNoz removed the v1 dashboard API (v0.142.1) — this section uses
    # /api/v2/dashboards. Dashboard JSON files are the "postable" v2/Perses
    # shape: {tags, spec: {display, layouts, panels, variables, ...}[, image]}.
    # Alerts use /api/v3/rules (list) and /api/v2/rules (write) with the
    # v2alpha1 rule schema; the /api/v1/rules endpoints are being removed.
    # Track all IaC dashboard titles so we can reconcile at the end.
    # Dashboards with tag "gitops" that are NOT in this list will be deleted.
    : > /tmp/synced_dashboard_titles

    # Load dashboards (update existing or create new - preserves IDs for stable links)
    DASHBOARD_DIR="/repo/$REPO_PATH/dashboards"
    if [ -d "$DASHBOARD_DIR" ] && ls "$DASHBOARD_DIR"/*.json 1> /dev/null 2>&1; then
      echo "Loading dashboards..."

      # Get existing dashboards
      existing=$(curl -s "$SIGNOZ_URL/api/v2/dashboards" \
        -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN")

      for f in "$DASHBOARD_DIR"/*.json; do
        [ -f "$f" ] || continue
        name=$(basename "$f" .json)
        title=$(jq -r '.spec.display.name // empty' "$f")
        echo "$title" >> /tmp/synced_dashboard_titles

        # Skip if file content unchanged since last successful sync
        file_hash=$(sha256sum "$f" | cut -d' ' -f1)
        if [ "$(get_hash "dash-$name")" = "$file_hash" ]; then
          echo "  Skipping unchanged dashboard: $name"
          continue
        fi

        echo "  Loading dashboard: $name (title: $title)"

        # Find existing dashboard by title
        existing_id=""
        if [ -n "$title" ]; then
          existing_id=$(echo "$existing" | jq -r --arg t "$title" \
            '.data.dashboards[]? | select(.spec.display.name == $t) | .id // empty' 2>/dev/null | head -1)
        fi

        if [ -n "$existing_id" ]; then
          echo "    Updating existing dashboard: $existing_id"
          response=$(curl -s -w "\n%{http_code}" -X PUT "$SIGNOZ_URL/api/v2/dashboards/$existing_id" \
            -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d @"$f")
        else
          echo "    Creating new dashboard"
          response=$(curl -s -w "\n%{http_code}" -X POST "$SIGNOZ_URL/api/v2/dashboards" \
            -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d @"$f")
        fi

        http_code=$(echo "$response" | tail -n1)
        body=$(echo "$response" | sed '$d')

        if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then
          echo "    Success"
          record_hash "dash-$name" "$file_hash"
        else
          echo "    Warning: HTTP $http_code - $body"
        fi
      done
    else
      echo "No dashboards found"
    fi

    # Reconcile: delete gitops-managed dashboards removed from IaC.
    # Only touches dashboards with the "gitops" tag — manually created dashboards are never deleted.
    echo "Reconciling dashboards..."
    all_dashboards=$(curl -s "$SIGNOZ_URL/api/v2/dashboards" \
      -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN")

    echo "$all_dashboards" | jq -c '.data.dashboards[]? | select(.tags[]? | .key == "tag" and .value == "gitops")' 2>/dev/null | \
    while read -r dash; do
      dash_uuid=$(echo "$dash" | jq -r '.id')
      dash_title=$(echo "$dash" | jq -r '.spec.display.name')

      if ! grep -qxF "$dash_title" /tmp/synced_dashboard_titles 2>/dev/null; then
        echo "  Deleting removed gitops dashboard: $dash_title ($dash_uuid)"
        response=$(curl -s -w "\n%{http_code}" -X DELETE "$SIGNOZ_URL/api/v2/dashboards/$dash_uuid" \
          -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN")
        http_code=$(echo "$response" | tail -n1)
        if [ "$http_code" = "200" ]; then
          echo "    Deleted"
        else
          echo "    Warning: HTTP $http_code"
        fi
      fi
    done

    # ── Alerts ────────────────────────────────────────────────────────────────
    # Track all IaC alert names so we can reconcile at the end.
    # Rules with labels.source=gitops that are NOT in this list will be deleted.
    : > /tmp/synced_alert_names
    # Fetch the rule list once per phase. The v2alpha1 migration moves the list
    # to /api/v3/rules, whose response envelope is not documented, so the id
    # lookups below search it recursively instead of assuming .data.rules.
    #
    # On any non-200 the file is left as {} and RULES_LIST_OK stays false, so
    # every lookup misses and the create paths refuse to run: a blind upsert
    # against an empty list would POST a duplicate of all 19 rules.
    RULES_LIST_OK=false
    fetch_rules() {
      _resp=$(curl -s -w "\n%{http_code}" "$SIGNOZ_URL/api/v3/rules" \
        -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN")
      _code=$(echo "$_resp" | tail -n1)
      if [ "$_code" = "200" ]; then
        echo "$_resp" | sed '$d' > /tmp/rules.json
        # A 200 whose envelope we cannot parse is the dangerous case: every
        # lookup would miss and the create path would POST a duplicate of each
        # rule. Treat "payload mentions rules but none parsed" as a failure.
        # Zero parsed with no rules in the payload is a legitimately empty
        # instance (first bootstrap), so creates stay allowed there.
        _n=$(jq '[.. | objects | select(((.alert? // "") != "") and ((.id? // "") != ""))] | unique_by(.id) | length' /tmp/rules.json 2>/dev/null || echo 0)
        if [ "${_n:-0}" -eq 0 ] && grep -q '"alert"' /tmp/rules.json 2>/dev/null; then
          RULES_LIST_OK=false
          echo "  ERROR: /api/v3/rules returned rules but none could be parsed - alert creates will be skipped"
        else
          RULES_LIST_OK=true
          echo "  Rule list: $_n existing rule(s)"
        fi
      else
        RULES_LIST_OK=false
        echo "{}" > /tmp/rules.json
        echo "  ERROR: GET /api/v3/rules returned HTTP $_code - alert creates will be skipped"
      fi
    }

    # Load alerts from ConfigMaps (label: signoz.homelab.io/alert=true)
    echo "Loading alerts from ConfigMaps..."

    # Get existing alerts
    fetch_rules
    existing_alerts=$(cat /tmp/rules.json)

    # List all ConfigMaps with the alert label.
    #
    # Capture into a file with an explicit success flag instead of piping
    # kubectl straight into jq: a `kubectl ... | jq | while` pipeline hides a
    # kubectl failure (only the final `while` exit counts, and there is no
    # pipefail), so a kube-API outage on this node would silently yield zero
    # desired alerts - and the reconcile below would then delete every gitops
    # alert. CONFIGMAPS_OK gates that prune so a load failure can't wipe alerts.
    CONFIGMAPS_OK=true
    if ! kubectl get configmaps -A -l signoz.homelab.io/alert=true -o json > /tmp/alert_cms.json 2>/tmp/cm_err; then
      CONFIGMAPS_OK=false
      echo "  ERROR: failed to list alert ConfigMaps ($(cat /tmp/cm_err)) - alert pruning will be skipped"
    fi
    jq -c '.items[]?' /tmp/alert_cms.json 2>/dev/null | while read -r cm; do
      cm_name=$(echo "$cm" | jq -r '.metadata.name')
      cm_namespace=$(echo "$cm" | jq -r '.metadata.namespace')
      alert_json=$(echo "$cm" | jq -r '.data["alert.json"]')

      if [ -z "$alert_json" ] || [ "$alert_json" = "null" ]; then
        echo "  Warning: ConfigMap $cm_namespace/$cm_name has no alert.json"
        continue
      fi

      alert_name=$(echo "$alert_json" | jq -r '.alert // empty')
      echo "$alert_name" >> /tmp/synced_alert_names

      # Skip if content unchanged since last successful sync
      content_hash=$(printf '%s' "$alert_json" | sha256sum | cut -d' ' -f1)
      hash_key="alert-cm-$cm_namespace-$cm_name"
      if [ "$(get_hash "$hash_key")" = "$content_hash" ]; then
        echo "  Skipping unchanged alert (ConfigMap): $cm_namespace/$cm_name"
        continue
      fi

      echo "  Loading alert from ConfigMap: $cm_namespace/$cm_name (name: $alert_name)"

      # Find existing alert by name
      existing_id=""
      if [ -n "$alert_name" ]; then
        existing_id=$(echo "$existing_alerts" | jq -r --arg n "$alert_name" \
          '[.. | objects | select((.alert? == $n) and ((.id? // "") != "")) | .id] | first // empty' 2>/dev/null)
      fi

      if [ -n "$existing_id" ]; then
        echo "    Updating existing alert: $existing_id"
        response=$(curl -s -w "\n%{http_code}" -X PUT "$SIGNOZ_URL/api/v2/rules/$existing_id" \
          -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN" \
          -H "Content-Type: application/json" \
          -d "$alert_json")
      else
        if [ "$RULES_LIST_OK" != "true" ]; then echo "    Skipping create: rule list unavailable, refusing to risk a duplicate"; continue; fi; echo "    Creating new alert"
        response=$(curl -s -w "\n%{http_code}" -X POST "$SIGNOZ_URL/api/v2/rules" \
          -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN" \
          -H "Content-Type: application/json" \
          -d "$alert_json")
      fi

      http_code=$(echo "$response" | tail -n1)
      body=$(echo "$response" | sed '$d')

      if echo "$http_code" | grep -qE "^2[0-9][0-9]$"; then
        echo "    Success"
        record_hash "$hash_key" "$content_hash"
      else
        echo "    Warning: HTTP $http_code - $body"
      fi
    done

    # Load alerts from git repo
    ALERT_DIR="/repo/$REPO_PATH/alerts"
    if [ -d "$ALERT_DIR" ] && ls "$ALERT_DIR"/*.json 1> /dev/null 2>&1; then
      echo "Loading alerts from git..."

      # Refresh existing alerts list
      fetch_rules
      existing_alerts=$(cat /tmp/rules.json)

      for f in "$ALERT_DIR"/*.json; do
        [ -f "$f" ] || continue
        name=$(basename "$f" .json)
        alert_name=$(jq -r '.alert // .data.alert // empty' "$f")
        echo "$alert_name" >> /tmp/synced_alert_names

        # Skip if file content unchanged since last successful sync
        file_hash=$(sha256sum "$f" | cut -d' ' -f1)
        if [ "$(get_hash "alert-$name")" = "$file_hash" ]; then
          echo "  Skipping unchanged alert: $name"
          continue
        fi

        echo "  Loading alert: $name (name: $alert_name)"

        # Find existing alert by name
        existing_id=""
        if [ -n "$alert_name" ]; then
          existing_id=$(echo "$existing_alerts" | jq -r --arg n "$alert_name" \
            '[.. | objects | select((.alert? == $n) and ((.id? // "") != "")) | .id] | first // empty' 2>/dev/null)
        fi

        if [ -n "$existing_id" ]; then
          echo "    Updating existing alert: $existing_id"
          response=$(curl -s -w "\n%{http_code}" -X PUT "$SIGNOZ_URL/api/v2/rules/$existing_id" \
            -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d @"$f")
        else
          if [ "$RULES_LIST_OK" != "true" ]; then echo "    Skipping create: rule list unavailable, refusing to risk a duplicate"; continue; fi; echo "    Creating new alert"
          response=$(curl -s -w "\n%{http_code}" -X POST "$SIGNOZ_URL/api/v2/rules" \
            -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d @"$f")
        fi

        http_code=$(echo "$response" | tail -n1)
        body=$(echo "$response" | sed '$d')

        if echo "$http_code" | grep -qE "^2[0-9][0-9]$"; then
          echo "    Success"
          record_hash "alert-$name" "$file_hash"
        else
          echo "    Warning: HTTP $http_code - $body"
        fi
      done
    else
      echo "No alerts found in git"
    fi

    # Reconcile: delete gitops-managed alerts removed from IaC.
    # Only touches rules with labels.source == "gitops" — manually
    # created rules are never deleted.
    #
    # Fail-safe: never prune when the desired set is untrustworthy. If the alert
    # ConfigMap load failed (a kube-API outage on this node) or produced zero
    # names, deleting every gitops alert is far worse than leaving a stale one,
    # so skip the reconcile entirely. (This is exactly how a run on an isolated
    # node once wiped all alerts.)
    if [ "$CONFIGMAPS_OK" != "true" ]; then
      echo "Skipping alert reconcile: ConfigMap load failed - refusing to prune gitops alerts"
    elif [ ! -s /tmp/synced_alert_names ]; then
      echo "Skipping alert reconcile: zero desired alerts loaded - refusing to delete all gitops alerts"
    else
      echo "Reconciling alerts..."
      fetch_rules
      all_rules=$(cat /tmp/rules.json)

      echo "$all_rules" | jq -c '[.. | objects | select((.labels? | objects | .source) == "gitops") | select((.id? // "") != "") | select((.alert? // "") != "") | {id, alert}] | unique_by(.id) | .[]' 2>/dev/null | \
      while read -r rule; do
        rule_id=$(echo "$rule" | jq -r '.id')
        rule_name=$(echo "$rule" | jq -r '.alert')

        if ! grep -qxF "$rule_name" /tmp/synced_alert_names 2>/dev/null; then
          echo "  Deleting removed gitops alert: $rule_name ($rule_id)"
          response=$(curl -s -w "\n%{http_code}" -X DELETE "$SIGNOZ_URL/api/v2/rules/$rule_id" \
            -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN")
          http_code=$(echo "$response" | tail -n1)
          if echo "$http_code" | grep -qE "^2[0-9][0-9]$"; then
            echo "    Deleted"
          else
            echo "    Warning: HTTP $http_code"
          fi
        fi
      done
    fi

    # ── Channels ──────────────────────────────────────────────────────────────
    # Reconcile notification-channel settings the SigNoz UI cannot express.
    #
    # Today that means the email Subject header. Alertmanager's default subject
    # template prints bare label values, so alert mail arrives titled
    # "<ruleId> (<alertname> <ruleSource> warning gitops warning)". The channels
    # API accepts email_configs[].headers, which overrides that - but the UI has
    # no field for headers, so saving the channel there silently drops it.
    # Re-asserting it on every run keeps it in place.
    #
    # Each channels/<name>.json is {"name": <channel name>, "headers": {...}}
    # and is merged onto the channel's live receiver config, so the large HTML
    # body template is preserved. A raw API PUT sends no test notification, but
    # only PUT when the live headers actually differ so a steady state is a no-op.
    CHANNEL_DIR="/repo/$REPO_PATH/channels"
    if [ -d "$CHANNEL_DIR" ] && ls "$CHANNEL_DIR"/*.json 1> /dev/null 2>&1; then
      echo "Reconciling notification channels..."

      all_channels=$(curl -s "$SIGNOZ_URL/api/v1/channels" \
        -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN")

      for f in "$CHANNEL_DIR"/*.json; do
        [ -f "$f" ] || continue
        name=$(basename "$f" .json)
        channel_name=$(jq -r '.name // empty' "$f")

        channel_id=$(echo "$all_channels" | jq -r --arg n "$channel_name" \
          '.data[]? | select(.name == $n) | .id // empty' 2>/dev/null | head -1)
        if [ -z "$channel_id" ]; then
          echo "  Warning: no SigNoz channel named '$channel_name' - skipping $name"
          continue
        fi

        current=$(curl -s "$SIGNOZ_URL/api/v1/channels/$channel_id" \
          -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN" | jq -r '.data.data')
        if [ -z "$current" ] || [ "$current" = "null" ]; then
          echo "  Warning: could not read channel $channel_name ($channel_id)"
          continue
        fi

        if [ "$(printf '%s' "$current" | jq -r 'has("email_configs")')" != "true" ]; then
          echo "  Warning: channel $channel_name is not an email channel - skipping"
          continue
        fi

        desired=$(printf '%s' "$current" | jq --slurpfile o "$f" \
          '.email_configs[0].headers = ((.email_configs[0].headers // {}) + $o[0].headers)')

        live_headers=$(printf '%s' "$current" | jq -cS '.email_configs[0].headers // {}')
        want_headers=$(printf '%s' "$desired" | jq -cS '.email_configs[0].headers')

        if [ "$live_headers" = "$want_headers" ]; then
          echo "  Skipping unchanged channel: $channel_name"
          continue
        fi

        # Guard against an endless re-PUT loop: if a previous run pushed this
        # exact override and SigNoz did not retain it, stop retrying instead of
        # rewriting every 5 minutes. Clears itself when the JSON file changes.
        want_hash=$(printf '%s' "$want_headers" | sha256sum | cut -d' ' -f1)
        if [ "$(get_hash "channel-$name-unsupported")" = "$want_hash" ]; then
          echo "  Skipping channel $channel_name: headers not retained by SigNoz on an earlier run"
          continue
        fi

        echo "  Updating channel: $channel_name ($channel_id)"
        response=$(curl -s -w "\n%{http_code}" -X PUT "$SIGNOZ_URL/api/v1/channels/$channel_id" \
          -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN" \
          -H "Content-Type: application/json" \
          -d "$desired")
        http_code=$(echo "$response" | tail -n1)
        body=$(echo "$response" | sed '$d')

        if [ "$http_code" != "200" ] && [ "$http_code" != "201" ]; then
          echo "    Warning: HTTP $http_code - $body"
          continue
        fi

        # Confirm the override actually survived the round trip.
        after=$(curl -s "$SIGNOZ_URL/api/v1/channels/$channel_id" \
          -H "SIGNOZ-API-KEY: $SIGNOZ_API_TOKEN" | jq -r '.data.data' | \
          jq -cS '.email_configs[0].headers // {}')
        if [ "$after" = "$want_headers" ]; then
          echo "    Success"
        else
          echo "    Warning: PUT accepted but headers were not retained (got: $after)"
          echo "             Recording as unsupported; will not retry until channels/$name.json changes."
          record_hash "channel-$name-unsupported" "$want_hash"
        fi
      done
    else
      echo "No channels found in git"
    fi

    # ── Save hash cache ───────────────────────────────────────────────────────
    # Persist updated hashes to ConfigMap for next run.
    hashes_json='{'
    first=true
    for hf in /tmp/hashes/*; do
      [ -f "$hf" ] || continue
      key=$(basename "$hf")
      val=$(cat "$hf")
      [ "$first" = "true" ] || hashes_json="$hashes_json,"
      hashes_json="${hashes_json}\"${key}\":\"${val}\""
      first=false
    done
    hashes_json="${hashes_json}}"

    printf '{"apiVersion":"v1","kind":"ConfigMap","metadata":{"name":"signoz-sync-hashes","namespace":"signoz"},"data":%s}\n' \
      "$hashes_json" | kubectl apply -f - > /dev/null

    echo "Sync complete!"
