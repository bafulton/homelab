namespace: coredns

# Automated sync remains paused until the final client-side access check passes.
syncPolicy:
  autoSync: false

# Note: This deployment creates TWO services:
# 1. coredns (ClusterIP) - Auto-created by upstream chart, cannot be disabled
#    - Internal cluster service, unused in our setup
# 2. coredns-tailscale (LoadBalancer) - Custom service defined in templates/
#    - Exposed via Tailscale at cluster-dns.catfish-mountain.ts.net
#    - Split DNS: explicit admin records and an apps apex/wildcard

coredns:
  resources:
    requests:
      memory: 48Mi
      cpu: 10m
    limits:
      memory: 128Mi

  service:
    enabled: false  # Attempted disable, but chart still creates ClusterIP service

  serviceType: ClusterIP

  serviceAccount:
    create: false
    name: default

  # CoreDNS zones and forwarding configuration
  servers:
    # Zone for catfish-mountain.com with wildcard
    - zones:
        - zone: catfish-mountain.com
      port: 53
      plugins:
        - name: errors
        - name: log
        - name: file
          parameters: /etc/coredns/catfish-mountain.com.db
        - name: cache
          parameters: 30

    # Forward all other queries to upstream DNS
    - zones:
        - zone: .
      port: 53
      plugins:
        - name: errors
        - name: log
        - name: health
          configBlock: |-
            lameduck 5s
        - name: ready
        - name: cache
          parameters: 30
        - name: forward
          parameters: . 1.1.1.1 8.8.8.8
        - name: reload
        - name: loadbalance

  # Custom zone file for catfish-mountain.com
  # Keep these records aligned with the current cluster-admin and cluster-apps
  # Tailscale Service addresses. Regenerate with scripts/update-ingress-dns.py.
  zoneFiles:
    - filename: catfish-mountain.com.db
      domain: catfish-mountain.com
      contents: |
        $ORIGIN catfish-mountain.com.
        @       3600 IN SOA sns.dns.icann.org. noc.dns.icann.org. (
                                2024010102 ; serial
                                7200       ; refresh (2 hours)
                                3600       ; retry (1 hour)
                                1209600    ; expire (2 weeks)
                                3600       ; minimum (1 hour)
                                )

        @       60 IN A 100.79.113.2
        *       60 IN A 100.79.113.2
        argocd          60 IN A 100.70.191.70
        longhorn        60 IN A 100.70.191.70
        garage          60 IN A 100.70.191.70
        signoz          60 IN A 100.70.191.70
        goldpinger      60 IN A 100.70.191.70
        traefik-apps    60 IN A 100.70.191.70
        traefik-admin   60 IN A 100.70.191.70
