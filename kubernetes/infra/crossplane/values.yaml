namespace: crossplane-system

# Crossplane installs many CRDs — needs server-side apply (see CLAUDE.md / snapshot-crds).
syncPolicy:
  serverSideApply: true

crossplane:
  # A complete list of values can be found here:
  # https://github.com/crossplane/crossplane/blob/master/cluster/charts/crossplane/values.yaml

  # Core just manages packages; the actual tofu work happens in the separate
  # provider-opentofu pod (sized when that provider is installed). Memory limit
  # lowered from the chart default (1024Mi) given beelink's memory headroom.
  # CPU request but no CPU limit, per repo convention (avoid CFS throttling).
  resourcesCrossplane:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  resourcesRBACManager:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

  # Providers/Functions installed in a follow-up step (Provider CRs), not here,
  # so core health can be verified first.
  provider:
    packages: []
  function:
    packages: []
