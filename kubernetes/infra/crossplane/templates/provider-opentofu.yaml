# provider-opentofu: the kube-native OpenTofu runner. A Workspace CR wraps HCL;
# deletionPolicy Delete (default) means deleting the CR runs `tofu destroy`.
# The OCI node and the Cloudflare config are HCL inside Workspaces — there are no
# native Crossplane OCI/Cloudflare providers in this approach.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-opentofu
spec:
  package: xpkg.upbound.io/upbound/provider-opentofu:v1.1.8
  runtimeConfigRef:
    name: provider-opentofu
---
# Bound the provider pod's memory (it runs tofu). CPU request, no CPU limit, per
# repo convention. The runtime container is named `package-runtime`.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-opentofu
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
