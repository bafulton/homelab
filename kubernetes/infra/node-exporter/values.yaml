namespace: node-exporter

prometheus-node-exporter:
  # Prometheus annotations for auto-discovery by signoz-k8s-infra
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9100"

  # Only what SigNoz's own host metrics (signoz-k8s-infra) don't collect:
  # temperatures (hwmon, thermal_zone) for the Node Temperature dashboard and
  # alert, plus PSI pressure and process counts for bottleneck diagnosis.
  # CPU, memory, disk, filesystem and network come from SigNoz's hostmetrics
  # receiver; node-exporter's default copies of them (network alone, counting
  # every pod's veth interface, was ~8% of all ingested samples) are off.
  # Replaces the chart's default extraArgs, which only tune the filesystem
  # collector.
  extraArgs:
    - --collector.disable-defaults
    - --collector.hwmon
    - --collector.thermal_zone
    - --collector.pressure
    - --collector.processes
    - --web.disable-exporter-metrics

  # Node exporter needs access to host paths for hardware metrics
  hostRootFsMount:
    enabled: true
    mountPropagation: HostToContainer

  # Tolerate all taints to run on all nodes (including control plane)
  tolerations:
    - effect: NoSchedule
      operator: Exists
