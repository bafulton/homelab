namespace: goldpinger

# Bloomberg's Goldpinger: a DaemonSet where every instance pings every other over
# the pod network and serves a live node-to-node connectivity + latency graph. The
# pod-network path rides the flannel (home) / Kilo (cross-location) mesh, so a
# broken or blackholed tunnel shows up immediately as a red / high-RTT edge.
goldpinger:
  # fullnameOverride so the Service name is deterministic (the gateway-route below
  # targets it by name).
  fullnameOverride: goldpinger

  # Label the graph by Kubernetes node name (beelink/rpi5/ocifree) instead of the
  # random pod name (goldpinger-bbmgb). Goldpinger reads each peer's node from the
  # pod list, so setting this on every instance relabels the whole UI.
  extraEnv:
    - name: DISPLAY_NODENAME
      value: "true"
    # Raise the per-peer ping timeout from the 300ms LAN default. The cross-location
    # leg is ~20-40ms normally, but a single lost packet triggers a TCP retransmit
    # (hundreds of ms) that blows past 300ms and gets scored "unhealthy" even though
    # the link is fine. 1s lets a retransmit complete, so transient WAN loss reads as
    # healthy-but-slow; a genuine outage still never responds and fires the alert.
    - name: PING_TIMEOUT
      value: "1s"

  # List pods cluster-wide to discover peers.
  rbac:
    create: true
    clusterscoped: true

  goldpinger:
    port: 8080
    # UDP probe adds packet-loss % and UDP RTT between peers on top of HTTP latency
    # - the extra signal that catches a lossy/degraded mesh link, not just a dead one.
    udp:
      enabled: true
      port: 6969

  service:
    type: ClusterIP
    port: 8081

  # Run on every node - including the control-plane (soft PreferNoSchedule taint on
  # beelink) and a remote node still carrying its boot-cordon taint - so no node is
  # invisible on the graph. Matches node-health's tolerate-everything posture.
  tolerations:
    - operator: Exists

  # Expose goldpinger_* metrics to SigNoz: the signoz-k8s-infra otel agent scrapes
  # pods annotated prometheus.io/scrape. Metrics are on the HTTP port (8080), /metrics.
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"

  # Tiny. No CPU limit (house rule): cpu request + memory request/limit only.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 64Mi

# UI on the tailnet only: goldpinger.catfish-mountain.com resolves via Tailscale
# Split DNS and is not routed through the public Cloudflare Tunnel.
gateway-route:
  routes:
    - name: private
      hostnames:
        - goldpinger.catfish-mountain.com
      service:
        name: goldpinger
        port: 8081

# Alert when any node-to-node mesh connection is unhealthy. goldpinger_cluster_health_total
# is "1 if all of this instance's peer checks pass, 0 otherwise" - a single 0/1 gauge per
# node, so it scales regardless of how many nodes/connections exist. spaceAggregation min
# fires if ANY instance sees a failure; `for: 5m` rides out transient reconciles (a kilo
# roll or an ocifree reboot flaps for ~30-60s) and only fires on a sustained break.
signoz-alerts:
  alerts:
    - name: Mesh Connection Unhealthy
      description: >-
        A goldpinger node-to-node connection is failing on the flannel/Kilo mesh
        (cluster health < 1). Check the graph at goldpinger.catfish-mountain.com.
      severity: warning
      type: threshold
      metric: goldpinger_cluster_health_total
      timeAggregation: min
      spaceAggregation: min
      op: "<"
      threshold: 1
      for: 5m0s
