# Identity is the Gateway's namespace/name/class, not an exempt listener name.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: gateway-public-listeners-need-public-hostname
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [gateway.networking.k8s.io]
        apiVersions: ['*']
        operations: [CREATE, UPDATE]
        resources: [gateways]
  validations:
    - expression: >-
        (object.metadata.namespace == 'traefik-admin' &&
         object.metadata.name == 'traefik-admin' &&
         object.spec.gatewayClassName == 'traefik-admin' &&
         object.spec.listeners.all(l,
           has(l.allowedRoutes) && has(l.allowedRoutes.kinds) &&
           size(l.allowedRoutes.kinds) == 1 &&
           l.allowedRoutes.kinds.all(k,
             k.group == 'gateway.networking.k8s.io' && k.kind == 'HTTPRoute') &&
           l.name == 'admin' && l.port == 443 && l.protocol == 'HTTPS')) ||
        (object.metadata.namespace == 'traefik-apps' &&
         object.metadata.name == 'traefik-apps' &&
         object.spec.gatewayClassName == 'traefik-apps' &&
         object.spec.listeners.all(l,
           has(l.allowedRoutes) && has(l.allowedRoutes.kinds) &&
           size(l.allowedRoutes.kinds) == 1 &&
           l.allowedRoutes.kinds.all(k,
             k.group == 'gateway.networking.k8s.io' && k.kind == 'HTTPRoute') &&
           ((l.name == 'web' && l.port == 80 && l.protocol == 'HTTP') ||
            (l.name == 'local' &&
             l.port == 443 && l.protocol == 'HTTPS' &&
             has(l.hostname) && l.hostname == '*.local') ||
            (l.name == 'edge' && l.port == 8443 && l.protocol == 'HTTPS' &&
             has(l.hostname) && l.hostname == '*.fultonhuffman.com'))))
      message: Gateways must use the dedicated admin or apps identity and approved listeners.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: gateway-public-listeners-need-public-hostname
spec:
  policyName: gateway-public-listeners-need-public-hostname
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: httproute-access-boundary
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [gateway.networking.k8s.io]
        apiVersions: ['*']
        operations: [CREATE, UPDATE]
        resources: [httproutes]
  variables:
    - name: admin
      expression: has(object.metadata.labels) && 'homelab.io/access' in object.metadata.labels && object.metadata.labels['homelab.io/access'] == 'admin'
    - name: apps
      expression: has(object.metadata.labels) && 'homelab.io/access' in object.metadata.labels && object.metadata.labels['homelab.io/access'] == 'apps'
  validations:
    - expression: variables.admin || variables.apps
      message: Every HTTPRoute must declare homelab.io/access as admin or apps.
    - expression: >-
        has(object.spec.parentRefs) && size(object.spec.parentRefs) > 0 &&
        object.spec.parentRefs.all(p,
          (!has(p.group) || p.group == 'gateway.networking.k8s.io') &&
          (!has(p.kind) || p.kind == 'Gateway') &&
          has(p.namespace) && has(p.sectionName) &&
          ((variables.admin && p.name == 'traefik-admin' && p.namespace == 'traefik-admin' && p.sectionName == 'admin') ||
           (variables.apps && p.name == 'traefik-apps' && p.namespace == 'traefik-apps' &&
            p.sectionName in ['web', 'edge', 'local'])))
      message: Routes must explicitly attach only to listeners matching their access class.
    - expression: >-
        object.spec.parentRefs.all(p,
          p.sectionName != 'local' ||
          (has(object.spec.hostnames) && size(object.spec.hostnames) > 0 &&
           object.spec.hostnames.all(h, h.endsWith('.local') && !h.contains('*'))))
      message: LAN HTTPS routes must use explicit .local hostnames.
    - expression: >-
        has(object.spec.hostnames) && size(object.spec.hostnames) > 0 &&
        object.spec.hostnames.all(h, !h.contains('*') &&
          ((variables.admin && h.endsWith('.catfish-mountain.com')) ||
           (variables.apps && (h.endsWith('.local') ||
             h == 'argocd-webhook.catfish-mountain.com' ||
             ['fultonhuffman.com', 'yak-shave.com', 'benfulton.me'].exists(d, h == d || h.endsWith('.' + d))))))
      message: Admin names belong on admin ingress; apps use explicit household/public names.
    - expression: >-
        !(object.metadata.namespace in ['longhorn', 'garage', 'signoz', 'goldpinger', 'traefik-admin', 'traefik-apps']) || variables.admin
      message: Administrative backend namespaces may only publish administrative routes.
    - expression: >-
        !variables.apps || object.metadata.namespace == 'argocd' ||
        !object.spec.hostnames.exists(h, h == 'argocd-webhook.catfish-mountain.com')
      message: The Argo webhook hostname may only be claimed by an apps route in the argocd namespace.
    - expression: >-
        !variables.apps || object.spec.rules.all(r,
          (!has(r.backendRefs) || r.backendRefs.all(b,
            (!has(b.group) || b.group == '') &&
            (!has(b.kind) || b.kind == 'Service') &&
            (!has(b.namespace) || b.namespace == object.metadata.namespace))) &&
          (!has(r.filters) || r.filters.all(f,
            f.type != 'RequestMirror' ||
            (has(f.requestMirror) && has(f.requestMirror.backendRef) &&
             (!has(f.requestMirror.backendRef.group) || f.requestMirror.backendRef.group == '') &&
             (!has(f.requestMirror.backendRef.kind) || f.requestMirror.backendRef.kind == 'Service') &&
             (!has(f.requestMirror.backendRef.namespace) ||
              f.requestMirror.backendRef.namespace == object.metadata.namespace)))))
      message: Apps routes may reference only same-namespace Services, including request mirror destinations.
    - expression: >-
        object.metadata.namespace != 'argocd' || variables.admin ||
        (size(object.spec.hostnames) == 1 && object.spec.hostnames[0] == 'argocd-webhook.catfish-mountain.com' &&
         object.spec.rules.all(r, has(r.matches) && size(r.matches) > 0 &&
           r.matches.all(m, has(m.method) && m.method == 'POST' &&
             has(m.path) && m.path.type == 'Exact' && m.path.value == '/api/webhook') &&
           !has(r.filters) && has(r.backendRefs) && size(r.backendRefs) == 1 &&
           r.backendRefs[0].name == 'argocd-server' && r.backendRefs[0].port == 80 &&
           (!has(r.backendRefs[0].namespace) || r.backendRefs[0].namespace == 'argocd')))
      message: Argo CD apps access is limited to POST /api/webhook on its webhook hostname.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: httproute-access-boundary
spec:
  policyName: httproute-access-boundary
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: disable-traefik-alternate-routes
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [traefik.io]
        apiVersions: ['*']
        operations: [CREATE, UPDATE]
        resources: [ingressroutes, ingressroutetcps, ingressrouteudps]
  validations:
    - expression: "false"
      message: Traefik IngressRoute resources are disabled; use a policy-validated HTTPRoute.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: disable-traefik-alternate-routes
spec:
  policyName: disable-traefik-alternate-routes
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: admin-ingress-no-lan-service
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [services]
  matchConditions:
    - name: admin-namespace
      expression: >-
        object.metadata.namespace in ['traefik-admin', 'argocd', 'longhorn', 'garage', 'signoz', 'goldpinger'] ||
        (object.metadata.namespace == 'traefik-apps' && object.metadata.name == 'traefik-apps-dashboard')
  validations:
    - expression: >-
        (!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0) &&
        (object.spec.type == 'ClusterIP' ||
         (object.spec.type == 'LoadBalancer' &&
          object.metadata.namespace == 'traefik-admin' && object.metadata.name == 'traefik-admin' &&
          has(object.metadata.annotations) && 'tailscale.com/tags' in object.metadata.annotations &&
          object.metadata.annotations['tailscale.com/tags'] == 'tag:k8s-admin' &&
          has(object.spec.ports) && size(object.spec.ports) == 1 &&
          object.spec.ports.all(p, p.port == 443 && p.protocol == 'TCP') &&
          has(object.spec.loadBalancerClass) && object.spec.loadBalancerClass == 'tailscale' &&
          has(object.spec.allocateLoadBalancerNodePorts) && !object.spec.allocateLoadBalancerNodePorts)) &&
        (!has(object.spec.ports) || object.spec.ports.all(p, !has(p.nodePort) || p.nodePort == 0))
      message: Admin Services must be ClusterIP or Tailscale LoadBalancer without node ports or external IPs.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: admin-ingress-no-lan-service
spec:
  policyName: admin-ingress-no-lan-service
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: admin-ingress-no-host-ports
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: admin-namespace
      expression: object.metadata.namespace == 'traefik-admin'
  validations:
    - expression: >-
        (!has(object.spec.hostNetwork) || !object.spec.hostNetwork) &&
        object.spec.containers.all(c, !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0)) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c,
          !has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0)))
      message: Admin ingress pods must not use host networking or host ports.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: admin-ingress-no-host-ports
spec:
  policyName: admin-ingress-no-host-ports
  validationActions: [Deny]
