namespace: signoz

# Home Assistant's /api/prometheus requires auth (HA listens on its node's LAN
# IP via hostNetwork, so only auth protects it), using a long-lived access
# token of HA's non-admin "metrics" user. Read by prometheus/home-assistant.
bitwarden-secret:
  secrets:
    - name: home-assistant-metrics-token
      data:
        token: "5b3fcf6c-b799-4c33-a9a0-b4ee001696c5"

k8s-infra:
  clusterName: homelab

  # Send metrics to the existing SigNoz OTel collector
  otelCollectorEndpoint: http://signoz-otel-collector.signoz:4318
  otelInsecure: true

  presets:
    # Collect container logs from all pods
    logsCollection:
      enabled: true
      operators:
        - id: container-parser
          type: container
        # Parse JSON log bodies and extract severity
        - type: json_parser
          if: 'body matches "^\\s*\\{"'
          parse_to: attributes
          on_error: send_quiet
          severity:
            parse_from: attributes.level
            preset: default
        # Strip [identifier] prefix from Longhorn-style prefixed logfmt logs so the
        # key_value_parser below can match. Covers both [pvc-id] and [longhorn-instance-manager].
        - type: regex_parser
          if: 'body matches "^\\[[^\\]]+\\] time=\""'
          regex: '^\[[^\]]+\] (?P<logfmt_content>.+)'
          parse_to: attributes
          on_error: send_quiet
        - type: move
          if: 'attributes["logfmt_content"] != nil'
          from: attributes.logfmt_content
          to: body
          on_error: send_quiet
        # Parse logrus logfmt logs (ArgoCD, Longhorn, etc.) and extract severity
        - type: key_value_parser
          if: 'body matches "^time=\""'
          parse_from: body
          parse_to: attributes
          on_error: send_quiet
        - type: severity_parser
          if: 'body matches "^time=\""'
          parse_from: attributes.level
          preset: default
          on_error: send_quiet
        # Parse Python logging format: YYYY-MM-DD HH:MM:SS.mmm LEVEL (thread)
        # Handles ANSI-colored logs (e.g., Home Assistant integrations)
        - type: regex_parser
          if: 'body matches "\\d{4}-\\d{2}-\\d{2} \\d{2}:\\d{2}:\\d{2}\\.\\d+ [A-Z]+ \\("'
          regex: '\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d+ (?P<level>[A-Z]+) \('
          parse_to: attributes
          on_error: send_quiet
          severity:
            parse_from: attributes.level
            preset: default
        # Replace raw JSON/logfmt body with the human-readable message field.
        # Try "message" first (lower priority), then "msg" (wins if both exist).
        - type: move
          if: 'attributes["message"] != nil'
          from: attributes.message
          to: body
          on_error: send_quiet
        - type: move
          if: 'attributes["msg"] != nil'
          from: attributes.msg
          to: body
          on_error: send_quiet

    # Enable host metrics (CPU, memory, disk, network per node)
    hostMetrics:
      enabled: true

    # Enable kubelet metrics (pod/container resource usage)
    kubeletMetrics:
      enabled: true

    # Enable cluster-level metrics (node conditions, allocatable resources)
    clusterMetrics:
      enabled: true

    # Enable Kubernetes events
    kubernetesEvents:
      enabled: true

    # Enable Prometheus scraping via annotation-based discovery
    # Services with prometheus.io/scrape: "true" annotation will be auto-discovered
    prometheus:
      enabled: true
      annotationsPrefix: prometheus.io

  otelAgent:
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
    config:
      processors:
        transform/normalize_severity:
          log_statements:
            - context: log
              statements:
                # Assign severity_number for text values stanza's default preset doesn't recognize
                - set(severity_number, 9) where severity_text == "Information"
                - set(severity_number, 13) where severity_text == "Warning"
                # Normalize severity_text to canonical OTel values based on severity_number
                - set(severity_text, "Trace") where severity_number >= 1 and severity_number <= 4
                - set(severity_text, "Debug") where severity_number >= 5 and severity_number <= 8
                - set(severity_text, "Info") where severity_number >= 9 and severity_number <= 12
                - set(severity_text, "Warn") where severity_number >= 13 and severity_number <= 16
                - set(severity_text, "Error") where severity_number >= 17 and severity_number <= 20
                - set(severity_text, "Fatal") where severity_number >= 21
            - context: resource
              statements:
                # Derive service.name from namespace — maps cleanly to "application" in this homelab
                - set(attributes["service.name"], attributes["k8s.namespace.name"]) where attributes["service.name"] == nil
      service:
        pipelines:
          logs:
            processors:
              - transform/normalize_severity
              - batch

  otelDeployment:
    resources:
      requests:
        memory: 192Mi
        cpu: 25m
      limits:
        memory: 768Mi
    extraVolumes:
      - name: ha-metrics-token
        secret:
          secretName: home-assistant-metrics-token
    extraVolumeMounts:
      - name: ha-metrics-token
        mountPath: /secrets/home-assistant
        readOnly: true
    config:
      receivers:
        # Annotation discovery (prometheus/scraper) can't send credentials, so
        # Home Assistant gets its own job. A separate receiver rather than a
        # second scrape_configs entry: Helm replaces lists, so adding to
        # prometheus/scraper's would drop the annotation job.
        prometheus/home-assistant:
          config:
            scrape_configs:
              - job_name: home-assistant
                scrape_interval: 60s
                metrics_path: /api/prometheus
                authorization:
                  type: Bearer
                  # Re-read on every scrape, so a rotated token needs no restart.
                  credentials_file: /secrets/home-assistant/token
                static_configs:
                  - targets: ["home-assistant.home-assistant.svc.cluster.local:80"]
      processors:
        transform/normalize_severity:
          log_statements:
            - context: log
              statements:
                # Assign severity_number for text values stanza's default preset doesn't recognize
                - set(severity_number, 9) where severity_text == "Information"
                - set(severity_number, 13) where severity_text == "Warning"
                # Normalize severity_text to canonical OTel values based on severity_number
                - set(severity_text, "Trace") where severity_number >= 1 and severity_number <= 4
                - set(severity_text, "Debug") where severity_number >= 5 and severity_number <= 8
                - set(severity_text, "Info") where severity_number >= 9 and severity_number <= 12
                - set(severity_text, "Warn") where severity_number >= 13 and severity_number <= 16
                - set(severity_text, "Error") where severity_number >= 17 and severity_number <= 20
                - set(severity_text, "Fatal") where severity_number >= 21
            - context: resource
              statements:
                # Derive service.name from namespace — maps cleanly to "application" in this homelab
                - set(attributes["service.name"], attributes["k8s.namespace.name"]) where attributes["service.name"] == nil
      service:
        pipelines:
          logs:
            processors:
              - transform/normalize_severity
              - batch
          # Restated in full because Helm replaces lists.
          metrics/scraper:
            receivers:
              - prometheus/scraper
              - prometheus/home-assistant
