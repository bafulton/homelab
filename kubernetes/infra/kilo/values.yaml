# Kilo runs in kube-system. Talos exempts kube-system from PodSecurity (flannel
# and kube-proxy already run privileged/hostNetwork there), so Kilo's privileged
# DaemonSet needs no namespace label.
namespace: kube-system

image:
  # renovate: datasource=docker depName=squat/kilo
  repository: squat/kilo
  tag: "0.7.0"

# STAGING KNOB — first coexistence test runs kg on rpi5 only, so the
# control-plane node (beelink) is untouched while we confirm Kilo coexists with
# flannel on Talos. Once rpi5 is verified healthy and the home LAN is still
# ~910 Mbit/s, widen to every node by setting this to `{}`.
nodeSelector:
  kubernetes.io/hostname: rpi5

# Repo convention: cpu + memory requests, memory limit only (never a cpu limit).
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 64Mi
