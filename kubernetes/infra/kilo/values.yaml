# Kilo runs in kube-system. Talos exempts kube-system from PodSecurity (flannel
# and kube-proxy already run privileged/hostNetwork there), so Kilo's privileged
# DaemonSet needs no namespace label.
namespace: kube-system

image:
  # renovate: datasource=docker depName=squat/kilo
  repository: squat/kilo
  tag: "0.7.0"

# kg reaches the API via the Tailscale control-plane endpoint, NOT the in-cluster
# ClusterIP. The kubernetes.default ClusterIP (10.96.0.1) DNATs to beelink's LAN
# InternalIP (192.168.1.86), which a remote node (ocifree) with no LAN presence
# cannot reach — and it's a chicken-and-egg: the Kilo mesh is what would make
# beelink's host IP reachable from the cloud, but kg needs the API first to build
# that mesh. The .ts.net endpoint is reachable from every node directly over
# Tailscale (the apiserver cert already lists this name as a SAN), so overriding
# KUBERNETES_SERVICE_HOST/PORT lets kg bootstrap everywhere. Home nodes reach it
# too, so this is set for all kg pods. Keep in sync with talconfig `endpoint`.
apiServer:
  host: beelink.catfish-mountain.ts.net
  port: "6443"

# Runs on every node. (Staged rollout 2026-10-22: validated on rpi5 first with
# `{kubernetes.io/hostname: rpi5}` — home LAN stayed ~907 Mbit/s, flannel path
# intact, kg inert at single location — then widened to all nodes.)
nodeSelector: {}

# Repo convention: cpu + memory requests, memory limit only (never a cpu limit).
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    memory: 64Mi
