apiVersion: v1
kind: ServiceAccount
metadata:
  name: kilo
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kilo
    app.kubernetes.io/part-of: kilo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kilo
  labels:
    app.kubernetes.io/name: kilo
    app.kubernetes.io/part-of: kilo
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - list
      - patch
      - watch
  - apiGroups:
      - kilo.squat.ai
    resources:
      - peers
    verbs:
      - list
      - watch
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kilo
  labels:
    app.kubernetes.io/name: kilo
    app.kubernetes.io/part-of: kilo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kilo
subjects:
  - kind: ServiceAccount
    name: kilo
    namespace: {{ .Release.Namespace }}
