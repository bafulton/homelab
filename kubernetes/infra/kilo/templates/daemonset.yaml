apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kilo
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: kilo
    app.kubernetes.io/part-of: kilo
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kilo
      app.kubernetes.io/part-of: kilo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kilo
        app.kubernetes.io/part-of: kilo
    spec:
      serviceAccountName: kilo
      hostNetwork: true
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kilo
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          args:
            # No --kubeconfig: Talos has no host kubeconfig, so kg falls back to
            # the in-cluster ServiceAccount (clientcmd.BuildConfigFromFlags with
            # an empty path). This is the one Talos-specific adaptation.
            - --hostname=$(NODE_NAME)
            - --cni=false                 # flannel owns pod CNI/IPAM, not Kilo
            - --compatibility=flannel
            - --local=false               # intra-location stays on flannel/LAN; Kilo meshes only across locations
            - --internal-cidr=$(NODE_IP)/32
            # Pin the WireGuard MTU. kg auto-detects from the local underlay, but
            # a cloud node's NIC is jumbo (OCI eth0 = 9000 -> kg would pick 8920)
            # while the cross-location tunnel actually traverses the public
            # internet (path MTU ~1500). An oversized MTU blackholes large packets
            # (WireGuard sets DF). 1420 = 1500 - 80 (WireGuard overhead) is the
            # safe single-hop value for the force-endpoint path.
            - --mtu=1420
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # Point kg's in-cluster client at the Tailscale API endpoint instead
            # of the ClusterIP (10.96.0.1 -> beelink LAN IP), which remote nodes
            # can't reach before the mesh exists. See apiServer in values.yaml.
            - name: KUBERNETES_SERVICE_HOST
              value: {{ .Values.apiServer.host | quote }}
            - name: KUBERNETES_SERVICE_PORT
              value: {{ .Values.apiServer.port | quote }}
          ports:
            - containerPort: 1107
              name: metrics
          securityContext:
            privileged: true
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: kilo-dir
              mountPath: /var/lib/kilo
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
            - name: xtables-lock
              mountPath: /run/xtables.lock
              readOnly: false
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
      volumes:
        - name: kilo-dir
          hostPath:
            path: /var/lib/kilo
        - name: lib-modules
          hostPath:
            path: /lib/modules
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
