namespace: time-machine

# MetalLB LoadBalancer IP (from pool 192.168.1.200-250)
service:
  loadBalancerIP: "192.168.1.201"

# Set to 0 to quiesce the share for volume maintenance. Never above 1 - one
# SMB share backed by a single RWO volume.
replicaCount: 1

# Storage: a dedicated 2 TB USB SSD on beelink, mounted at /var/mnt/tm by
# Talos (talos/patches/nodes/beelink.yaml). A plain hostPath rather than
# Longhorn: a backup target gets nothing from replication or snapshots, and
# it keeps 1 TiB of sustained writes off the Longhorn NVMe.
local-storage:
  pvcs:
    - name: time-machine-data
      path: /var/mnt/tm/time-machine
      size: 1800Gi
      node: beelink

# Time Machine configuration
# Single shared account - per-machine quotas enforced via .quota.plist
timemachine:
  user: Family
  uid: 1000
  # Per-machine quota in bytes (900GB = 900000000000)
  # Each Mac gets this much space independently
  quotaBytes: 900000000000

# Samba image configuration
image:
  repository: mbentley/timemachine
  # renovate: datasource=docker depName=mbentley/timemachine
  tag: smb
  pullPolicy: IfNotPresent

# Bitwarden secrets for SMB password
bitwarden-secret:
  secrets:
    - name: time-machine-credentials
      data:
        # Reusing ben's password - can create a dedicated one later
        password: "a00db757-d2bf-495a-b33a-b3cf002ad2a3"

# mDNS advertisement for Time Machine auto-discovery
# IP must match service.loadBalancerIP above
mdnsServices:
  - name: Time Machine
    hostname: timemachine
    ip: 192.168.1.201
    port: 445
    types:
      # SMB file sharing
      - type: _smb._tcp
      # Apple disk service (required for Time Machine auto-discovery)
      # Single shared volume with per-machine quotas via .quota.plist
      - type: _adisk._tcp
        txtRecords:
          - "sys=adVF=0x100"
          - "dk0=adVN=Family,adVF=0x82"
      # Device info (shows as Time Capsule in Finder)
      - type: _device-info._tcp
        txtRecords:
          - "model=TimeCapsule8,119"

resources:
  requests:
    memory: 256Mi
    cpu: 10m
  limits:
    memory: 512Mi

signoz-alerts:
  alerts:
    - name: Time Machine Down
      description: Time Machine SMB server has no ready replicas
      severity: critical
      type: promql
      query: 'max by (namespace, statefulset) (kube_statefulset_status_replicas_ready{namespace="time-machine",statefulset="time-machine"})'
      op: "<"
      threshold: 1
      for: 5m0s
