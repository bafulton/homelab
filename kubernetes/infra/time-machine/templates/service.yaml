# A LAN address from MetalLB; service.annotations in values.yaml pins it.
apiVersion: v1
kind: Service
metadata:
  name: time-machine
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: time-machine
  ports:
    - name: smb
      port: 445
      targetPort: 445
      protocol: TCP
    - name: netbios-ssn
      port: 139
      targetPort: 139
      protocol: TCP
