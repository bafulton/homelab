{{- if .Values.nodeConfig }}
{{- range .Values.nodeConfig.nodes }}
---
apiVersion: longhorn.io/v1beta2
kind: Node
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    # Prevent Helm from deleting this resource - Longhorn manages the status
    helm.sh/resource-policy: keep
spec:
  name: {{ .name }}
  # hasKey, not `default`: Helm treats false as empty, so `false | default true`
  # renders true and makes an explicit `allowScheduling: false` a silent no-op.
  allowScheduling: {{ if hasKey . "allowScheduling" }}{{ .allowScheduling }}{{ else }}true{{ end }}
  evictionRequested: false
  tags: {{ .tags | default list | toJson }}
  # Only manage disks for a node that declares them. A node with no `disks` omits
  # the field entirely (rather than rendering an empty map), so Longhorn's own
  # auto-created default disk is left untouched instead of being deleted - deleting
  # an enabled disk is rejected by the validator webhook ("disable the disk and
  # remove all replicas first"). For such a node, node-level allowScheduling:false
  # keeps replicas off it regardless of that disk. This also stays correct across a
  # re-provision, where the default disk's generated name changes.
  {{- with .disks }}
  disks:
    {{- range $diskName, $disk := . }}
    {{ $diskName }}:
      allowScheduling: {{ if hasKey $disk "allowScheduling" }}{{ $disk.allowScheduling }}{{ else }}true{{ end }}
      evictionRequested: false
      path: {{ $disk.path }}
      storageReserved: {{ $disk.storageReserved | default 0 | int64 }}
      tags: {{ $disk.tags | default list | toJson }}
      diskType: filesystem
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
