namespace: longhorn

# Garage backup credentials for Longhorn. The key is named longhorn-backup in
# Garage; AWS_ACCESS_KEY_ID is its key ID, which Garage requires to be in
# GK + 24-hex form. backupTarget below keeps its us-east-1 region, which
# matches s3_region in Garage's config.
bitwarden-secret:
  secrets:
    - name: longhorn-backup-credentials
      data:
        AWS_ACCESS_KEY_ID: "GK692f81c1982632383b08d5ff"
        AWS_SECRET_ACCESS_KEY: "154f9f3f-ec4f-40d8-8ae1-b4e701515074"
        AWS_ENDPOINTS: "http://garage.garage.svc.cluster.local:3900"

# Ignore preserveUnknownFields on CRDs (per Longhorn ArgoCD docs)
# https://longhorn.io/docs/1.7.2/deploy/install/install-with-argocd/
ignoreDifferences:
  - group: apiextensions.k8s.io
    kind: CustomResourceDefinition
    jsonPointers: ["/spec/preserveUnknownFields"]

# Node-specific disk configuration
# Each disk is tagged for use with specific StorageClasses
nodeConfig:
  nodes:
    - name: beelink
      allowScheduling: true
      disks:
        # eMMC drive (Talos EPHEMERAL partition). Vacated 2026-10-19: every
        # replica now lives on nvme-disk. Kept declared with scheduling off
        # rather than deleted, so the boot device stays a named, visible part
        # of the topology instead of something a future disk edit might
        # silently start filling.
        emmc-disk:
          path: /var/lib/longhorn
          storageReserved: 16106127360  # 15GB reserved for OS
          tags: ["emmc"]
          allowScheduling: false
        # NVMe SSD - backs all three storage classes, and therefore every
        # Longhorn volume in the cluster.
        nvme-disk:
          path: /var/mnt/nvme
          storageReserved: 0
          tags: ["nvme"]

    - name: rpi5
      allowScheduling: false  # USB drive is owned by Garage (see infra/garage)
      disks: {}

storageClasses:
# Classes are named for what the data IS, not which drive it sits on.
#
# Naming by drive couples the PVC to a hardware detail, and storageClassName is
# immutable - so when data moves between disks the class name becomes a lie
# that cannot be corrected without recreating the PVC. Naming by purpose keeps
# the class true no matter where the replica lands.
#
# diskSelector is the single join between intent and hardware: it matches the
# `tags` set on each disk in nodeConfig above. Changing which drive a purpose
# lives on is a one-line edit here plus a replica migration - never PVC
# surgery. All three point at nvme today, which is deliberate: it keeps the
# divergence point explicit rather than letting an added disk silently collect
# volumes.
#
# Moving EXISTING replicas is a separate operation - see "Migrating replicas
# between disks" in README.md.
#
# reclaimPolicy: Retain on all three. A deleted PVC then leaves its PV and
# Longhorn volume behind rather than destroying the data, which is what makes a
# class migration a relabel instead of a copy, and what stops a mistaken PVC
# deletion being unrecoverable. The cost is orphaned volumes to clean up by
# hand. reclaimPolicy is immutable on a StorageClass, so changing this later
# means deleting and recreating the class.

  # Small, precious application config. Snapshotted and backed up via
  # RecurringJobs (see the per-app backupGroup in each app's values.yaml).
  - name: config
    diskSelector: nvme
    replicas: 1
    dataLocality: disabled
    reclaimPolicy: Retain

  # Operational state that is either rebuildable or too large to back up
  # (observability stores, Time Machine's own backup target).
  - name: state
    diskSelector: nvme
    replicas: 1
    dataLocality: disabled
    reclaimPolicy: Retain

  # Disposable scratch space. Losing it costs a slower next run, nothing more.
  - name: scratch
    diskSelector: nvme
    replicas: 1
    dataLocality: disabled
    reclaimPolicy: Retain

  # Two classes exist live that are deliberately NOT declared here:
  #
  # - `longhorn` is suppressed by persistence.createStorageClass: false below.
  # - `longhorn-static` CANNOT be suppressed. longhorn-manager recreates it
  #   from its own default-longhorn-static-storage-class setting, which it
  #   uses internally for statically provisioned volumes - it has been deleted
  #   before and came back within minutes. Nothing here references it, so it
  #   is harmless. Leave it alone rather than trying again.


longhorn:
  # Talos-specific configuration
  # Docs: https://longhorn.io/docs/1.10.1/advanced-resources/os-distro-specific/talos-linux-support/

  # Disable default "longhorn" StorageClass - we use our own tagged classes
  persistence:
    # createStorageClass, not defaultClass, is what removes the built-in
    # "longhorn" class. defaultClass: false only stops it being the default -
    # the class is still created, and it requests 3 replicas, which can never
    # schedule here (one node has Longhorn disks and replica-soft-anti-affinity
    # is false). Any PVC naming it would sit Pending forever.
    createStorageClass: false
    defaultClass: false

  # Prometheus annotations for Longhorn Manager DaemonSet
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9500"

  # Disable pre-upgrade checker - incompatible with ArgoCD
  # https://github.com/longhorn/longhorn/issues/8707
  preUpgradeChecker:
    jobEnabled: false

  defaultSettings:
    # Data path for Talos (matches kubelet extraMount)
    defaultDataPath: /var/lib/longhorn
    # Freeze filesystem before snapshot to prevent DeadlineExceeded on busy volumes.
    # Calls fsfreeze to pause writes, takes snapshot (near-instant), then unfreezes.
    # Safe on Talos (kernel 6.x).
    freezeFilesystemForSnapshot: true
    engineReplicaTimeout: 30
    backupExecutionTimeout: 20
    # Every volume is single-replica on beelink, so under the default
    # (block-if-contains-last-replica) beelink's instance-manager PDB never
    # releases and no drain of beelink can finish. This releases it once the
    # node's replicas are stopped - i.e. once the drain has evicted the pods
    # using them. The data stays on beelink's disk through the reboot.
    nodeDrainPolicy: allow-if-replica-is-stopped

  defaultBackupStore:
    backupTarget: "s3://longhorn-backups@us-east-1/"
    backupTargetCredentialSecret: longhorn-backup-credentials

  # Disable default pod security policies (deprecated in k8s 1.25+)
  enablePSP: false

  longhornManager:
    resources:
      requests:
        memory: 320Mi
        cpu: 50m
      limits:
        memory: 512Mi

gateway-route:
  routes:
    - name: dashboard
      hostnames:
        - longhorn.catfish-mountain.com
      service:
        name: longhorn-frontend
        port: 80
