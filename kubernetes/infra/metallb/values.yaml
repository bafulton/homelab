namespace: metallb

# IP pool for LoadBalancer services. Customize for your network:
# - Must be in your LAN subnet
# - Must not overlap with DHCP range or other static IPs
# - These IPs are announced via ARP (Layer 2 mode)
pool:
  name: default-pool
  addresses:
    - "192.168.1.200-192.168.1.250"

advertisement:
  name: default
  ipAddressPools:
    - default-pool

metallb:
  # A complete list of values can be found here:
  # https://github.com/metallb/metallb/blob/main/charts/metallb/values.yaml

  controller:
    # Placement: local (LAN) nodes only — MetalLB does L2/ARP for the LAN pool
    # and must never run on a remote/cloud node. See charts/README.md "Placement".
    nodeSelector:
      homelab.io/location: local
    resources:
      requests:
        memory: 64Mi
        cpu: 10m
      limits:
        memory: 128Mi

  speaker:
    logLevel: info
    # Placement: local (LAN) nodes only — the speaker answers ARP for LAN IPs
    # (e.g. 192.168.1.200); on a cloud node it would break L2 announcement.
    nodeSelector:
      homelab.io/location: local
    resources:
      requests:
        memory: 48Mi
        cpu: 10m
      limits:
        memory: 128Mi
    frr:
      enabled: false
    # Allow MetalLB to announce from control plane nodes
    # (Talos adds exclude-from-external-load-balancers label by default)
    ignoreExcludeLB: true

  frr-k8s:
    frrk8s:
      # Placement: local only — frr-k8s is the speaker's L2/BGP backend DaemonSet.
      nodeSelector:
        homelab.io/location: local
      resources:
        requests:
          memory: 128Mi
          cpu: 15m
        limits:
          memory: 256Mi
