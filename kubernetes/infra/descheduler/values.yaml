namespace: descheduler

descheduler:
  # Runs as a short-lived CronJob rather than an always-on Deployment, so it
  # doesn't add steady-state memory load to the already-tight beelink node.
  kind: CronJob
  schedule: "*/15 * * * *"

  # Keep old job pods around briefly for debugging, but don't accumulate them.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  ttlSecondsAfterFinished: 600

  # Lean footprint for a job that runs for a few seconds every 15 min.
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

  # Full policy override. The chart's default profile enables ~7 plugins; we run
  # ONLY LowNodeUtilization — the single plugin that addresses our actual problem
  # (workloads concentrating on the local nodes, especially beelink). Everything
  # else would be a no-op for single-replica deployments, so we leave it off to
  # keep the blast radius tiny and the intent obvious.
  #
  # LowNodeUtilization scores nodes by resource *requests* (not live usage) and
  # evicts pods from over-utilized nodes (a *source*, over targetThresholds) so
  # the scheduler can re-home them onto under-utilized ones (a *target*, under
  # thresholds). With no source node, nothing is evicted — so load spreads onto a
  # remote node only once a local node is genuinely over the source threshold.
  # nodeFit plus the PVC/local-storage protections below mean only stateless,
  # unpinned, arch-compatible pods ever actually move.
  deschedulerPolicy:
    # Evict at most a few pods per node per run: gentle, observable convergence.
    maxNoOfPodsToEvictPerNode: 3
    profiles:
      - name: rebalance
        pluginConfig:
          - name: DefaultEvictor
            args:
              # CRITICAL: only evict a pod if it can actually schedule elsewhere.
              # This is what protects the beelink-pinned workloads (Longhorn PVCs
              # via Longhorn disk/node affinity, amd64-only images, static
              # control-plane pods) from being thrashed — they have no other home,
              # so the descheduler leaves them alone instead of churning them.
              nodeFit: true
              # Leave pods under 5 minutes old alone. Short Job pods (e.g.
              # signoz-dashboard-sync, backoffLimit 0) were evicted a second
              # after starting, failing the Job and marking its ArgoCD app
              # Degraded; it also stops a just-moved pod being moved again.
              minPodAge: 5m
              podProtections:
                # emptyDir/hostPath scratch is ephemeral anyway (lost on any
                # restart), so allow those stateless controllers to move.
                defaultDisabled:
                  - "PodsWithLocalStorage"
                # But never touch pods backed by a real PVC (ClickHouse, garage,
                # signoz-db, home-assistant, etc.) — belt-and-suspenders on top
                # of nodeFit.
                extraEnabled:
                  - "PodsWithPVC"
          - name: LowNodeUtilization
            args:
              # A node is a *target* (under-utilized) only if BOTH are below:
              thresholds:
                cpu: 40
                memory: 50
              # A node is a *source* (over-utilized) if EITHER is above:
              # CPU is 75, not 60: ocifree has under 2 CPUs and ~860m of fixed
              # requests, so 60 tripped on a few small pods while its memory sat
              # at 19%, and the evicted pods landed straight back on it (185
              # evictions in 30h, no change in balance).
              targetThresholds:
                cpu: 75
                memory: 65
        plugins:
          balance:
            enabled:
              - LowNodeUtilization
