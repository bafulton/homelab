# Trust the public homelab root certificate once on participating clients.
# Explicit SANs avoid relying on a top-level *.local wildcard.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: household-local
  namespace: {{ .Release.Namespace }}
spec:
  secretName: household-local-tls
  duration: 2160h
  renewBefore: 720h
  privateKey:
    rotationPolicy: Always
  usages:
    - digital signature
    - key encipherment
    - server auth
  dnsNames:
    - games.local
    - home.local
    - media.local
  issuerRef:
    name: homelab-ca
    kind: ClusterIssuer
