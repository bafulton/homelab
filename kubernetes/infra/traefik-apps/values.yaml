namespace: traefik-apps
skipCrds: true

# This controller serves household/public routes and the shared OCI edge.
traefik:
  priorityClassName: system-cluster-critical
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  providers:
    kubernetesGateway:
      enabled: true
      labelSelector: homelab.io/ingress=apps
      gateways:
        - name: traefik-apps
          namespace: traefik-apps
    kubernetesIngress:
      enabled: false
    kubernetesCRD:
      enabled: true
      ingressClass: traefik-apps
      labelSelector: homelab.io/ingress=apps
  ports:
    web:
      port: 80
      expose:
        default: true
        tailscale: true
    websecure:
      port: 443
      expose:
        default: false
        tailscale: false
    edge:
      port: 8443
      exposedPort: 8443
      expose:
        default: false
        tailscale: true
      http:
        tls:
          enabled: true
  gateway:
    # The wrapper template emits this Gateway with an explicit HTTPRoute-only
    # allowedRoutes.kinds contract. The upstream chart does not expose kinds.
    enabled: false
    name: traefik-apps
    listeners:
      web:
        port: 80
        protocol: HTTP
        namespacePolicy:
          from: All
      edge:
        port: 8443
        protocol: HTTPS
        hostname: '*.fultonhuffman.com'
        namespacePolicy:
          from: All
        certificateRefs:
          - name: media-fultonhuffman-com-tls
          - name: games-fultonhuffman-com-tls
        mode: Terminate
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik-apps-traefik-apps
    matchLabelKeys:
    - pod-template-hash
  # Household .local application traffic must stay on the home LAN.
  nodeSelector:
    homelab.io/location: local
  tolerations:
  - key: homelab.io/prefer-off
    operator: Exists
    effect: PreferNoSchedule
  deployment:
    replicas: 2
    podAnnotations:
      prometheus.io/scrape: 'true'
      prometheus.io/port: '9100'
  service:
    annotations:
      metallb.io/loadBalancerIPs: 192.168.1.200
    additionalServices:
      tailscale:
        annotations:
          tailscale.com/hostname: cluster-apps
          tailscale.com/tags: tag:k8s-apps
        spec:
          type: LoadBalancer
          loadBalancerClass: tailscale
          allocateLoadBalancerNodePorts: false
    spec:
      type: LoadBalancer
      allocateLoadBalancerNodePorts: false
  metrics:
    prometheus:
      service:
        enabled: true
  resources:
    requests:
      memory: 64Mi
      cpu: 10m
    limits:
      memory: 128Mi
  fullnameOverride: traefik-apps
  ingressClass:
    enabled: false
  gatewayClass:
    name: traefik-apps
    labels:
      homelab.io/ingress: apps
  api:
    dashboard: true
    insecure: true
gateway-route:
  routes:
  - name: dashboard
    access: admin
    hostnames:
    - traefik-apps.catfish-mountain.com
    service:
      name: traefik-apps-dashboard
      port: 8080
