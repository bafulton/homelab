# Stage 2: LAN Service stays ClusterIP until the coordinated VIP handoff.
namespace: traefik-apps
skipCrds: true

# Retain the legacy controller until the final cutover is complete.
syncPolicy:
  prune: false

# This controller serves household/public routes and the shared OCI edge.
traefik:
  priorityClassName: system-cluster-critical
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  providers:
    kubernetesGateway:
      enabled: true
      labelSelector: homelab.io/ingress=apps
      gateways:
        - name: traefik-apps
          namespace: traefik-apps
    kubernetesIngress:
      enabled: false
    kubernetesCRD:
      enabled: true
      ingressClass: traefik-apps
      labelSelector: homelab.io/ingress=apps
  ports:
    web:
      port: 80
      expose:
        default: true
        tailscale: true
    websecure:
      port: 443
      expose:
        default: false
        tailscale: false
    edge:
      port: 8443
      exposedPort: 8443
      expose:
        default: false
        tailscale: true
      http:
        tls:
          enabled: true
  # Stage 2 uses the chart-generated Gateway. Stage 3 adds the wrapper template
  # so admission can enforce the HTTPRoute-only allowedRoutes contract.
  gateway:
    enabled: true
    name: traefik-apps
    listeners:
      web:
        port: 80
        protocol: HTTP
        namespacePolicy:
          from: All
      edge:
        port: 8443
        protocol: HTTPS
        hostname: '*.fultonhuffman.com'
        namespacePolicy:
          from: All
        certificateRefs:
          - name: media-fultonhuffman-com-tls
          - name: games-fultonhuffman-com-tls
        mode: Terminate
  topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik-apps-traefik-apps
    matchLabelKeys:
    - pod-template-hash
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          - key: homelab.io/location
            operator: In
            values:
            - local
  tolerations:
  - key: homelab.io/prefer-off
    operator: Exists
    effect: PreferNoSchedule
  deployment:
    replicas: 2
    podAnnotations:
      prometheus.io/scrape: 'true'
      prometheus.io/port: '9100'
  service:
    annotations: {}
    # Separate Tailscale service exposes household HTTP and the OCI edge only.
    additionalServices:
      tailscale:
        annotations:
          tailscale.com/hostname: cluster-apps
          tailscale.com/tags: tag:k8s-apps
        spec:
          type: LoadBalancer
          loadBalancerClass: tailscale
          allocateLoadBalancerNodePorts: false
    spec:
      # The old gateway keeps .200 until the stage-3 VIP transfer.
      type: ClusterIP
  metrics:
    prometheus:
      service:
        enabled: true
  resources:
    requests:
      memory: 64Mi
      cpu: 10m
    limits:
      memory: 128Mi
  fullnameOverride: traefik-apps
  ingressClass:
    enabled: false
  gatewayClass:
    name: traefik-apps
    labels:
      homelab.io/ingress: apps
  api:
    dashboard: true
    insecure: true
gateway-route:
  # Stage 2 publishes this dashboard on the new admin Gateway before the
  # shared chart's default mapping switches during stage 3.
  gateways:
    admin:
      name: traefik-admin
      namespace: traefik-admin
      listeners:
      - admin
  routes:
  - name: dashboard
    access: admin
    hostnames:
    - traefik-apps.catfish-mountain.com
    service:
      name: traefik-apps-dashboard
      port: 8080
