apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/bafulton/homelab
        revision: main
        files:
          - path: kubernetes/apps/*/values.yaml
  template:
    metadata:
      name: '{{ get . "name" | default .path.basenameNormalized }}'  # eg, "jellyfin" from "kubernetes/apps/jellyfin"
      annotations:
        argocd.argoproj.io/sync-wave: '{{ get . "syncWave" | default "0" }}'
    spec:
      project: default
      source:
        repoURL: https://github.com/bafulton/homelab
        targetRevision: main
        path: '{{ .path.path }}'  # eg, kubernetes/apps/jellyfin
        helm:
          releaseName: '{{ get . "name" | default .path.basenameNormalized }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ get . "namespace" | default .path.basenameNormalized }}'
  templatePatch: |
    spec:
      syncPolicy:
        automated:
          # Omitted metadata preserves the default automatic reconciliation.
          enabled: {{ if and (get . "syncPolicy") (hasKey .syncPolicy "autoSync") }}{{ .syncPolicy.autoSync }}{{ else }}true{{ end }}
          prune: {{ if and (get . "syncPolicy") (hasKey .syncPolicy "prune") }}{{ .syncPolicy.prune }}{{ else }}true{{ end }}
          selfHeal: {{ if and (get . "syncPolicy") (hasKey .syncPolicy "selfHeal") }}{{ .syncPolicy.selfHeal }}{{ else }}true{{ end }}
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
          {{- if and (get . "syncPolicy") (index .syncPolicy "serverSideApply") }}
          - ServerSideApply=true
          {{- end }}
      {{- if or (get . "skipCrds") (get . "honorNulls") }}
      source:
        helm:
          {{- if (get . "skipCrds") }}
          # Do not apply the chart's crds/ directory. Helm's `helm template`
          # omits crds/ unless --include-crds is passed, but ArgoCD always
          # includes it - so a chart can be shipping CRDs that a local render
          # never shows. Use this where a companion chart owns the CRDs, so two
          # apps do not both claim them and fight over the schema.
          skipCrds: true
          {{- end }}
          {{- if (get . "honorNulls") }}
          # Helm ignores a null that a chart's own values.yaml sets for a
          # subchart, so `cpu: null` can't remove an upstream chart's default
          # CPU limit. Passing values.yaml as a values file as well makes Helm
          # apply it.
          valueFiles:
            - values.yaml
          {{- end }}
      {{- end }}
      {{- if (get . "ignoreDifferences") }}
      ignoreDifferences:
        {{- range $diff := .ignoreDifferences }}
        - group: {{ index $diff "group" | default "" | quote }}
          kind: {{ index $diff "kind" | quote }}
          {{- if (index $diff "name") }}
          name: {{ index $diff "name" | quote }}
          {{- end }}
          {{- if (index $diff "namespace") }}
          namespace: {{ index $diff "namespace" | quote }}
          {{- end }}
          {{- if (index $diff "jsonPointers") }}
          jsonPointers:
            {{- range $ptr := (index $diff "jsonPointers") }}
            - {{ $ptr | quote }}
            {{- end }}
          {{- end }}
          {{- if (index $diff "jqPathExpressions") }}
          jqPathExpressions:
            {{- range $expr := (index $diff "jqPathExpressions") }}
            - {{ $expr | quote }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}
