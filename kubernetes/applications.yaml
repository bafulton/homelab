# The bootstrap-owned root Application. Keep this manifest as its source of
# truth; apply it from Git when the runbook changes root reconciliation.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: applications
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bafulton/homelab
    targetRevision: main
    path: kubernetes/appsets
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      enabled: false
