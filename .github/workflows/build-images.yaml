name: Build Images

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - '.github/workflows/build-images.yaml'
  pull_request:
    paths:
      - 'images/**'
      - '.github/workflows/build-images.yaml'
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - homelab-toolbox
          - mdns-advertiser
    steps:
      - uses: actions/checkout@v7

      - name: Read image version
        id: meta
        run: |
          VERSION=$(tr -d '[:space:]' < "images/${{ matrix.image }}/VERSION")
          if [ -z "$VERSION" ]; then
            echo "::error::images/${{ matrix.image }}/VERSION is empty"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # arm64 (rpi5, ocifree) is cross-built under emulation.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull requests build both architectures but push nothing, so a broken
      # Dockerfile fails review instead of reaching the cluster.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
          # Keeps GHCR free of the "unknown/unknown" attestation manifests.
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
