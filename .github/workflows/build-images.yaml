name: Build Images

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - '.github/workflows/build-images.yaml'
  pull_request:
    paths:
      - 'images/**'
      - '.github/workflows/build-images.yaml'
  workflow_dispatch:
    inputs:
      image:
        description: Image to build and publish
        required: true
        type: choice
        options:
          - homelab-toolbox
          - mdns-advertiser
          - geyser-standalone

concurrency:
  # Serialize releases across refs so two manual/push runs cannot both pass
  # the tag-existence check before either publishes.
  group: build-images
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.changed.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select changed images and check versions
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          REQUESTED_IMAGE: ${{ inputs.image }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "images=[\"$REQUESTED_IMAGE\"]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT" = pull_request ]; then BASE="$PR_BASE"; else BASE="$PUSH_BASE"; fi
          case "$BASE" in
            ''|0000000000000000000000000000000000000000)
              BASE=$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || true)
              ;;
          esac
          if [ -z "$BASE" ]; then
            echo "::error::No base commit available to check image versions"
            exit 1
          fi

          selected=()
          for image in homelab-toolbox mdns-advertiser geyser-standalone; do
            if [ -z "$(git diff --name-only "$BASE" "$HEAD_SHA" -- "images/$image/")" ]; then
              continue
            fi
            old=$(git show "$BASE:images/$image/VERSION" 2>/dev/null || true)
            new=$(tr -d '[:space:]' < "images/$image/VERSION")
            if [ -z "$new" ] || [ "$old" = "$new" ]; then
              echo "::error file=images/$image/VERSION::images/$image changed without a new VERSION"
              exit 1
            fi
            selected+=("$image")
          done
          images=$(printf '%s\n' "${selected[@]}" | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "images=$images" >> "$GITHUB_OUTPUT"

  build:
    needs: select
    if: needs.select.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.select.outputs.images) }}
    steps:
      - uses: actions/checkout@v7

      - name: Read image version
        id: meta
        run: |
          VERSION=$(tr -d '[:space:]' < "images/${{ matrix.image }}/VERSION")
          if [ -z "$VERSION" ]; then
            echo "::error::images/${{ matrix.image }}/VERSION is empty"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # arm64 (rpi5, ocifree) is cross-built under emulation.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject existing image tags
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          for tag in "ghcr.io/$OWNER/$IMAGE:$VERSION" "ghcr.io/$OWNER/$IMAGE:sha-$GITHUB_SHA"; do
            if docker buildx imagetools inspect "$tag" > "$RUNNER_TEMP/tag-inspect" 2>&1; then
              echo "::error::$tag already exists; refusing to replace an image tag"
              exit 1
            fi
            if grep -Eqi 'not found|manifest unknown|name unknown' "$RUNNER_TEMP/tag-inspect"; then
              echo "Image tag $tag is available"
            else
              cat "$RUNNER_TEMP/tag-inspect"
              echo "::error::Could not verify whether $tag exists"
              exit 1
            fi
          done

      # Pull requests build both architectures but push nothing, so a broken
      # Dockerfile fails review instead of reaching the cluster.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: images/${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
          # Keeps GHCR free of the "unknown/unknown" attestation manifests.
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
