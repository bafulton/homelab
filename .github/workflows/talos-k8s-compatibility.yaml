name: Talos-Kubernetes Compatibility Check

on:
  pull_request:
    paths:
      - 'talos/cluster.yaml'
      - 'kubernetes/infra/tuppr/values.yaml'
      - 'kubernetes/infra/tuppr/templates/talos-upgrade.yaml'
      - 'kubernetes/infra/tuppr/templates/kubernetes-upgrade.yaml'
      - '.github/scripts/check_talos_compatibility.py'
      - '.github/scripts/test_check_talos_compatibility.py'
      - '.github/workflows/talos-k8s-compatibility.yaml'

jobs:
  check-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test compatibility check
        run: python3 -m unittest discover -s .github/scripts -p 'test_check_talos_compatibility.py'
      - name: Check bootstrap and upgrade versions
        run: python3 .github/scripts/check_talos_compatibility.py
