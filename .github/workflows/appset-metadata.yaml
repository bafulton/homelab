name: ApplicationSet metadata

on:
  pull_request:
    paths:
      - 'kubernetes/infra/*/values.yaml'
      - 'kubernetes/apps/*/values.yaml'
      - '.github/scripts/check_appset_metadata.py'
      - '.github/workflows/appset-metadata.yaml'
  push:
    branches: [main]
    paths:
      - 'kubernetes/infra/*/values.yaml'
      - 'kubernetes/apps/*/values.yaml'
      - '.github/scripts/check_appset_metadata.py'
      - '.github/workflows/appset-metadata.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install 'PyYAML==6.0.3'
      - run: python .github/scripts/check_appset_metadata.py
