# Talos Cluster Configuration
#
# This file defines the entire cluster configuration for Talhelper.
# Secrets are provided via environment variables (see .env.example).
#
# Usage:
#   1. Copy .env.example to .env and fill in your values
#   2. Run: talhelper genconfig
#   3. Apply configs to nodes
#
# Docs: https://budimanjojo.github.io/talhelper/latest/

clusterName: homelab
talosVersion: v1.14.4
kubernetesVersion: v1.37.1
endpoint: https://beelink.catfish-mountain.ts.net:6443

allowSchedulingOnControlPlanes: true

cniConfig:
  name: flannel

# ------------------------------------------------------------------------------
# Nodes
# ------------------------------------------------------------------------------
# NOTE: Update the tailnet name below if you fork this repo
nodes:
  - hostname: beelink
    controlPlane: true
    ipAddress: beelink.catfish-mountain.ts.net
    installDisk: /dev/mmcblk0  # eMMC, not the NVMe SSD
    # Image Factory schematic with extensions: intel-ucode, iscsi-tools, tailscale, util-linux-tools, i915
    # Note: Don't include version tag - talhelper appends talosVersion automatically
    talosImageURL: factory.talos.dev/installer/445a99db4002e6127e7f6e2a96377ac2c06d0de52f7a186b5536c0ac2f2a2ece
    nodeLabels:
      storage.homelab.io/emmc: "true"
      storage.homelab.io/nvme: "true"
      storage.homelab.io/usb: "true"
      homelab.io/location: "local"
    # Soft anti-affinity: bias movable workloads OFF this node toward rpi5.
    # PreferNoSchedule is a preference, not a ban — pods that can only run here
    # (Longhorn-PVC via node affinity, amd64-only images, static control-plane)
    # still schedule because the soft taint yields when there's no alternative.
    # Custom untolerated key so it applies to all genuinely-movable pods.
    # Works together with the descheduler: descheduler evicts off beelink, this
    # taint (TaintToleration weight 3 > ImageLocality weight 1) makes the
    # scheduler re-home them onto rpi5 instead of straight back here.
    nodeTaints:
      homelab.io/prefer-off: "true:PreferNoSchedule"
    patches:
      # Mount NVME and USB drives for Longhorn storage
      - |-
        machine:
          disks:
            - device: {{ env "BEELINK_NVME_DISK" }}
              partitions:
                - mountpoint: /var/mnt/nvme
            - device: {{ env "BEELINK_USB_DISK" }}
              partitions:
                - mountpoint: /var/mnt/usb

      # Kubelet extraMounts for Longhorn to access NVME and USB drives
      - |-
        machine:
          kubelet:
            extraMounts:
              - destination: /var/mnt/nvme
                type: bind
                source: /var/mnt/nvme
                options:
                  - bind
                  - rshared
                  - rw
              - destination: /var/mnt/usb
                type: bind
                source: /var/mnt/usb
                options:
                  - bind
                  - rshared
                  - rw

  - hostname: rpi5
    controlPlane: false
    ipAddress: rpi5.catfish-mountain.ts.net
    installDisk: /dev/mmcblk0  # SD card
    # Official Talos via the sbc-raspberrypi rpi_5 overlay.
    # Schematic = rpi_5 overlay + configTxtAppend "dtparam=eee=off" (disables the
    # BCM54213PE AutogrEEEn LPI-wake race) + iscsi-tools, tailscale, util-linux-tools.
    # Pi 5 is community-tested, not officially tested: skim
    # github.com/siderolabs/sbc-raspberrypi before bumping talosVersion.
    # See talos/rpi5-notes.md
    talosImageURL: factory.talos.dev/installer/3ec14befcbf3baad2a84ae0dd95bdfaaed37364451e02b8f3c4b79c52a948d37
    nodeLabels:
      storage.homelab.io/usb: "true"
      homelab.io/location: "local"
    patches:
      # RPi5-specific cert SANs for Tailscale access
      - |-
        machine:
          certSANs:
            - rpi5.catfish-mountain.ts.net

      # macb TX-stall mitigation (sbc-raspberrypi#91). The in-kernel watchdog
      # (Talos >= v1.13.3) re-kicks a stalled TX ring, but disabling TSO/GSO and
      # enlarging the rings cuts how often it has to. Pairs with the
      # "dtparam=eee=off" baked into the image schematic above.
      - |-
        apiVersion: v1alpha1
        kind: EthernetConfig
        name: end0
        features:
          tx-tcp-segmentation: false
          tx-tcp6-segmentation: false
          tx-generic-segmentation: false
        rings:
          rx: 4096
          tx: 4096

      # Mount USB drive for Longhorn storage
      - |-
        machine:
          disks:
            - device: {{ env "RPI5_USB_DISK" }}
              partitions:
                - mountpoint: /var/mnt/usb

      # Kubelet extraMount for USB drive (Longhorn access)
      - |-
        machine:
          kubelet:
            extraMounts:
              - destination: /var/mnt/usb
                type: bind
                source: /var/mnt/usb
                options:
                  - bind
                  - rshared
                  - rw

  - hostname: ocifree
    controlPlane: false
    # Cloud node (OCI Ampere A1, arm64). No LAN presence; reached over Tailscale
    # for talosctl/apply, and joins the cluster via the beelink endpoint.
    ipAddress: ocifree.catfish-mountain.ts.net
    # OCI A1 paravirtualized boot volume. The node boots from the imported Talos
    # image; install.disk matters for in-place upgrades (tuppr).
    installDisk: /dev/sda
    # Oracle arm64 schematic (iscsi-tools + tailscale + util-linux-tools), built
    # by opentofu/oci-node/build-oci-image.sh. talhelper appends :talosVersion.
    talosImageURL: factory.talos.dev/installer/708747e350d604ae9e57227d8dcf274091453ddb1097b765d4ea8884f1992c1f
    nodeLabels:
      homelab.io/location: "remote"
    # Declarative Kilo location so kg sees it the instant the node registers
    # (no post-bootstrap annotate race). force-endpoint is set after join, once
    # the public IP is known (see opentofu/oci-node).
    nodeAnnotations:
      kilo.squat.ai/location: "cloud"
    patches:
      # certSAN so talosctl can reach ocifree by its tailnet name.
      - |-
        machine:
          certSANs:
            - ocifree.catfish-mountain.ts.net
      # Cloud node: kubelet node IP is the Tailscale address only. Replaces the
      # all-nodes validSubnets (which also lists the LAN /24 ocifree lacks) so
      # kubelet never picks the OCI private 10.21.x address.
      - |-
        machine:
          kubelet:
            nodeIP:
              validSubnets:
                - 100.64.0.0/10
            # Boot cordoned: register with a NoSchedule taint so no regular
            # workloads schedule before the post-provision steps (Kilo
            # force-endpoint + networking verification) complete. The networking
            # DaemonSets (kilo/flannel/kube-proxy) tolerate it and still come up.
            # registerWithTaints applies only at initial node registration, not on
            # reboots (the node object persists), and it's a kubelet-config taint,
            # not machine.nodeTaints, so the post-init `kubectl taint ... -` sticks.
            # See talos/README.md "Local vs remote node profile".
            extraConfig:
              registerWithTaints:
                - key: node.homelab.io/uninitialized
                  value: "true"
                  effect: NoSchedule
      # Remote-node profile: ephemeral Tailscale registration (see talos/README.md
      # "Local vs remote node profile"). Overrides the all-nodes tailscale
      # ExtensionServiceConfig to drop ?ephemeral=false, so a terminated cloud node
      # is reaped by Tailscale and a reprovisioned one reclaims the ocifree name
      # instead of colliding into ocifree-1. Takes effect on next (re)registration.
      - |-
        apiVersion: v1alpha1
        kind: ExtensionServiceConfig
        name: tailscale
        environment:
          - TS_CLIENT_ID={{ env "TS_CLIENT_ID" }}
          - TS_CLIENT_SECRET={{ env "TS_CLIENT_SECRET" }}
          - TS_EXTRA_ARGS=--accept-routes --ssh --advertise-tags=tag:k8s-node

# ------------------------------------------------------------------------------
# Patches - Applied to ALL nodes
# ------------------------------------------------------------------------------
patches:
  # Talos API certificate SANs for Tailscale access
  - |-
    machine:
      certSANs:
        - beelink.catfish-mountain.ts.net

  # Networking: Use Tailscale MagicDNS with fallback to Google DNS
  - |-
    machine:
      network:
        nameservers:
          - 100.100.100.100
          - 8.8.8.8

  # Forward kube-dns to the Talos host resolver (169.254.116.108). It tries the
  # nameservers above in order and falls back only on an error, so tailnet
  # names reliably reach MagicDNS. CoreDNS's own forwarding picks an upstream at
  # random, so 8.8.8.8 answered NXDOMAIN for *.ts.net and CoreDNS cached it.
  # After changing this on a running cluster, restart the coredns pods.
  - |-
    machine:
      features:
        hostDNS:
          enabled: true
          forwardKubeDNSToHost: true

  # Kubelet: Use LAN IPs for node addresses (enables MetalLB L2 mode)
  # Tailscale is still used for API access via the endpoint
  - |-
    machine:
      kubelet:
        nodeIP:
          validSubnets:
            - 192.168.1.0/24
            - 100.64.0.0/10

  # Tailscale extension configuration via ExtensionServiceConfig
  #
  # NOTE: containerboot registers OAuth client secrets as ephemeral nodes by
  # default (Tailscale deletes the node soon after it goes offline). Appending
  # ?ephemeral=false makes the node durable, so a power loss / extended outage
  # doesn't cause the node to be reaped and re-registered as an ephemeral node
  # on reconnect.
  #
  # No --accept-dns: Talos owns the node's DNS, with 100.100.100.100 as its
  # first nameserver. MagicDNS still answers tailnet names without the flag and
  # returns SERVFAIL for the rest, so the host resolver moves on to 8.8.8.8.
  # With the flag, Tailscale forwarded every non-tailnet name to the system
  # resolver (127.0.0.53), which forwarded it straight back to MagicDNS: a loop
  # that ran at ~600 queries/s and made MagicDNS drop queries.
  - |-
    apiVersion: v1alpha1
    kind: ExtensionServiceConfig
    name: tailscale
    environment:
      - TS_CLIENT_ID={{ env "TS_CLIENT_ID" }}
      - TS_CLIENT_SECRET={{ env "TS_CLIENT_SECRET" }}?ephemeral=false
      - TS_EXTRA_ARGS=--accept-routes --ssh --advertise-tags=tag:k8s-node

  # Kernel modules for Longhorn storage
  - |-
    machine:
      kernel:
        modules:
          - name: iscsi_tcp

  # Kubelet mount for Longhorn data path (required for Talos v1.10+)
  - |-
    machine:
      kubelet:
        extraMounts:
          - destination: /var/lib/longhorn
            type: bind
            source: /var/lib/longhorn
            options:
              - bind
              - rshared
              - rw

  # Sysctls for container networking
  - |-
    machine:
      sysctls:
        net.core.somaxconn: "65535"
        net.core.netdev_max_backlog: "4096"

# ------------------------------------------------------------------------------
# Control Plane Patches
# ------------------------------------------------------------------------------
controlPlane:
  patches:
    # API server certificate SANs for Tailscale access
    - |-
      cluster:
        apiServer:
          certSANs:
            - beelink.catfish-mountain.ts.net
            - beelink
            - 127.0.0.1

    # Disable in-tree cloud provider
    - |-
      cluster:
        controllerManager:
          extraArgs:
            cloud-provider: external

    # kube-apiserver has no memory limit, so nothing bounds Go's GC from
    # holding onto its high-water mark. GOMEMLIMIT is a soft target — unlike
    # a hard k8s limit, exceeding it triggers more GC, not an OOMKill, so
    # it's safe on the cluster's only control-plane node. Set ~12% above
    # observed steady-state usage (the initial 2765MiB was too generous to
    # ever engage the GC — usage never got close to it).
    - |-
      cluster:
        apiServer:
          env:
            GOMEMLIMIT: 2150MiB

    # Enable Talos API access from Kubernetes for tuppr upgrade controller
    - |-
      machine:
        features:
          kubernetesTalosAPIAccess:
            enabled: true
            allowedRoles:
              - os:admin
            allowedKubernetesNamespaces:
              - tuppr

    # CoreDNS pod anti-affinity is applied via kubectl patch after upgrade-k8s
    # (inline manifest approach conflicts with upgrade-k8s manifest reconciliation
    # because partial Deployment specs fail Kubernetes validation)
