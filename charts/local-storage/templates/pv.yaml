{{- range $.Values.pvcs }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .name }}
spec:
  capacity:
    storage: {{ .size }}
  accessModes:
    - {{ .accessMode | default "ReadWriteOnce" }}
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: {{ .path }}
    # Directory, not DirectoryOrCreate: if the underlying disk is not mounted,
    # fail the pod rather than let kubelet silently create an empty directory
    # on the root filesystem and present it as the volume.
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - {{ .node }}
{{- end }}
