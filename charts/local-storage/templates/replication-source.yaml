{{- range $.Values.pvcs }}
{{- if .backup }}
---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: {{ .name }}
spec:
  sourcePVC: {{ .name }}
  trigger:
    {{- if .backup.manual }}
    # A manual token runs the backup once, then VolSync waits - and while the
    # token is set the schedule does not run at all (the two triggers are
    # mutually exclusive). Remove it to resume the schedule; the run is done
    # when status.lastManualSync matches the token.
    manual: {{ .backup.manual | quote }}
    {{- else }}
    schedule: {{ .backup.schedule | quote }}
    {{- end }}
  restic:
    repository: {{ .backup.repository }}
    copyMethod: Direct
    {{- with .backup.cacheStorageClassName }}
    cacheStorageClassName: {{ . }}
    {{- end }}
    {{- with .backup.retain }}
    retain:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
{{- end }}
