{{- if and .Values.workload.enabled .Values.portal.subjects }}
{{- $name := include "game-server.name" . }}
---
# Start and stop only: the scale subresource of this one StatefulSet, and
# reading pods for status. Nothing that changes the game's spec.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-portal
  labels:
    {{- include "game-server.labels" . | nindent 4 }}
rules:
  - apiGroups: [apps]
    resources: [statefulsets]
    resourceNames: [{{ $name }}]
    verbs: [get]
  - apiGroups: [apps]
    resources: [statefulsets/scale]
    resourceNames: [{{ $name }}]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-portal
  labels:
    {{- include "game-server.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-portal
subjects:
  {{- toYaml .Values.portal.subjects | nindent 2 }}
{{- end }}
