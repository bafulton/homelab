{{- define "mdns-config.configmap" -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .name }}
  labels:
    mdns.homelab.io/advertise: "true"
data:
  # JSON so the advertiser can parse with stdlib json and carry no PyYAML
  # dependency. Built as an explicit dict rather than `toJson .service` so
  # callers passing extra keys under `mdns:` don't leak into the payload.
  config.json: {{ dict
      "name" .service.name
      "hostname" .service.hostname
      "ip" .service.ip
      "port" (.service.port | int)
      "types" .service.types
    | toJson | quote }}
{{- end }}
