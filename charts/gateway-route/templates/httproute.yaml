{{- range .Values.routes }}
{{- $parents := include "gateway-route.parentRefs" (dict "root" $ "route" .) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $.Release.Name }}-{{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    homelab.io/access: {{ .access }}
spec:
  parentRefs:
    {{- $parents | nindent 4 }}
  hostnames:
    {{- range .hostnames }}
    - {{ . }}
    {{- end }}
  rules:
    {{- if .rules }}
    {{- toYaml .rules | nindent 4 }}
    {{- else }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .service.name }}
          port: {{ .service.port | default 80 }}
          weight: 1
    {{- end }}
{{- end }}
