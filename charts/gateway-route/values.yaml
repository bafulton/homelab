# Infrastructure-owned mapping; applications normally set only route.access.
# Migration stages 1/2 keep application traffic on the scoped legacy Gateway.
gateways:
  admin:
    name: traefik
    namespace: traefik
    listeners: [web, websecure]
  apps:
    name: traefik
    namespace: traefik
    listeners: [web, websecure]

routes: []
