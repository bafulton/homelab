#   hostnames: [myapp.catfish-mountain.com]
#   service:
#     name: myapp
#     port: 80
# Apps normally inherit web/websecure. OCI services may override listeners:
# listeners: [web, websecure, edge-media]  # media
# listeners: [web, websecure, edge-games]  # games
