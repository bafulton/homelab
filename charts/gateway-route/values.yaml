# Infrastructure-owned mapping; applications normally set only route.access.
# Both classes now use their dedicated Gateways after cutover.
gateways:
  admin:
    name: traefik-admin
    namespace: traefik-admin
    listeners: [admin]
  apps:
    name: traefik-apps
    namespace: traefik-apps
    listeners: [web, websecure]

routes: []
# - name: dashboard
