# Infrastructure-owned mapping; applications normally set only route.access.
# Both access classes use their dedicated Gateways.
gateways:
  admin:
    name: traefik-admin
    namespace: traefik-admin
    listeners: [admin]
  apps:
    name: traefik-apps
    namespace: traefik-apps
    listeners: [web]

routes: []
