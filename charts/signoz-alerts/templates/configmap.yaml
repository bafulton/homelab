{{/*
Emits v2alpha1 alert rules. The v1 schema (top-level evalWindow/frequency,
condition.op/target/matchType, preferredChannels) is deprecated and its
endpoints are being removed; see
https://signoz.io/docs/alerts-management/migrate-alert-rules-schema-v1-to-v2alpha1/

Notes on the conversion:
  - `severity` becomes the threshold tier name (condition.thresholds.spec[].name).
    labels.severity is kept because each rule has exactly one threshold and the
    email Subject template reads .CommonLabels.severity.
  - `renotify` is off by design. v1 re-notified every 4h while firing, which
    is noise here: the first email is the to-do item. v2alpha1 requires the
    block, so it is spelled out as disabled.
  - `broadcastToAll` is dropped; v2alpha1 requires an explicit non-empty
    channel list per threshold, which the thresholds block now carries.
*/}}
{{- $defaults := .Values.defaults }}
{{- range .Values.alerts }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-signoz-alert-{{ .name | lower | replace " " "-" | trunc 50 }}
  labels:
    signoz.homelab.io/alert: "true"
data:
  alert.json: |
    {
      "schemaVersion": "v2alpha1",
      "alert": {{ .name | quote }},
      "alertType": "METRIC_BASED_ALERT",
      "disabled": false,
      "description": {{ .description | quote }},
      "summary": {{ .summary | default .description | quote }},
      "labels": {
        "source": "gitops",
        "severity": {{ .severity | default $defaults.severity | quote }}
      },
      "evaluation": {
        "kind": "rolling",
        "spec": {
          "evalWindow": {{ include "signoz-alerts.evalWindow" (dict "alert" . "root" $) | quote }},
          "frequency": {{ .frequency | default $defaults.frequency | quote }}
        }
      },
      "notificationSettings": {
        "renotify": {
          "enabled": false
        },
        "usePolicy": false
      },
      {{- if eq .type "threshold" }}
      "ruleType": "threshold_rule",
      "condition": {{ include "signoz-alerts.thresholdCondition" (dict "alert" . "root" $) | nindent 6 }}
      {{- else if eq .type "ratio" }}
      "ruleType": "threshold_rule",
      "condition": {{ include "signoz-alerts.ratioCondition" (dict "alert" . "root" $) | nindent 6 }}
      {{- else if eq .type "promql" }}
      "ruleType": "promql_rule",
      "condition": {{ include "signoz-alerts.promqlCondition" (dict "alert" . "root" $) | nindent 6 }}
      {{- else }}
      {{ fail (printf "Unsupported alert type '%s'. Supported types: threshold, ratio, promql" .type) }}
      {{- end }}
    }
{{- end }}
